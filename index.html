<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const CFG = window.APP_CONFIG;

// Human-readable role names. The AREA_COACH key is kept internally (it is in
// the directory mapping and in stored invoices) but is never shown to users —
// the org now calls this role District Manager.
const ROLE_LABELS = {
  ADMIN: "Admin", FINANCE: "Finance", DIRECTOR: "Director of Ops",
  AREA_COACH: "District Manager", VP: "VP of Ops", MANAGER: "Store Manager"
};
function roleLabel(r) { return ROLE_LABELS[r] || (r || "").replace(/_/g, " "); }

/* ============================================================
   1. DIRECTORY ADAPTER
   Maps the alignment API onto the shapes the UI expects.
   Nothing is hardcoded: every approver is resolved from the API.
   ============================================================ */

// Division is not a field in the directory, so it is derived from the store
// name. Car Wash is tested FIRST — "Paradise Car Wash #1" would otherwise be
// caught by the Paradise/C-Store rule. Anything unmatched surfaces as
// "Unknown" rather than silently defaulting, so new store types get noticed.
function deriveDivision(storeName) {
  const n = (storeName || "").toLowerCase();
  if (n.includes("car wash")) return "Car Wash";
  if (n.startsWith("burger king") || n.startsWith("subway")) return "Fast Food";
  if (n.startsWith("paradise quick stop") ||
      n.startsWith("scarborough travel stop") ||
      n.startsWith("7-eleven")) return "C-Store";
  return "Unknown";
}

// The directory has two record generations:
//   newer DFW stores -> assignedAreaCoachId  (string, sometimes "")
//   older stores     -> assignedAreaCoachIds (array) AND the singular field
// Reading only the plural field silently drops the AC on ~45 DFW stores.
function readCoachIds(rest) {
  const plural = rest.assignedAreaCoachIds;
  if (Array.isArray(plural) && plural.length) return plural.filter(Boolean);
  const single = rest.assignedAreaCoachId;
  return single ? [single] : [];
}

const directoryService = {
  async load() {
    const bust = (CFG.directoryUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
    const res = await fetch(CFG.directoryUrl + bust, { cache: "no-store" });
    if (!res.ok) throw new Error("Directory API " + res.status);
    const data = await res.json();

    const coaches   = data.areaCoaches || {};
    const directors = data.directors   || {};
    const rests     = data.restaurants || {};

    // Flat user map: id -> { id, name, email, role }
    const users = {};
    Object.values(directors).forEach(d => {
      users[d.id] = { id: d.id, name: d.name, email: d.email || "", role: "DIRECTOR" };
    });
    Object.values(coaches).forEach(c => {
      // A person can appear as both; DIRECTOR already registered wins for role,
      // but we still want them selectable as an Area Coach approver.
      if (!users[c.id]) {
        users[c.id] = { id: c.id, name: c.name, email: c.email || "", role: "AREA_COACH" };
      }
    });
    // There is no VP role in the directory, so register the VP from config.
    // If that id already exists (Sam is also a Director), keep the existing
    // record and just note the extra role rather than overwriting it.
    if (users[CFG.vp.id]) {
      users[CFG.vp.id].alsoVP = true;
    } else {
      users[CFG.vp.id] = { id: CFG.vp.id, name: CFG.vp.name, email: CFG.vp.email, role: "VP" };
    }

    const stores = Object.values(rests).map(r => ({
      id: r.id,
      name: r.storeName || "(unnamed)",
      storeNumber: r.storeNumber || "",
      division: deriveDivision(r.storeName),
      acIds: readCoachIds(r),
      directorId: r.assignedDirectorId || null,
      storeManager: r.storeManager || "",
      email: r.email || "",          // store mailbox — managers sign in with this
      entity: r.entity || "",        // legal entity, e.g. "Al's Quick Stop Inc."
      address: r.address || ""
    })).sort((a, b) => a.name.localeCompare(b.name));

    return { users, stores };
  }
};

/* ============================================================
   2. APPROVAL CHAINS — one INDEPENDENT chain per store.

   A 4-store invoice carries 4 chains. Each chain runs its own
   AC -> DO (-> VP) sequence with its own status, current stage,
   SLA clock, and history. One chain rejecting does not touch the
   others: 3 of 4 stores can approve while the 4th rejects, and
   Finance processes payment for the approved subset.

   Within a step, ANY listed user may approve (two-coach stores).
   The VP threshold applies to the invoice TOTAL, and when it
   triggers, the VP step appears in EVERY chain — so the VP can
   approve some stores and reject others.
   ============================================================ */

// Steps for ONE store. Identical to the original single-store rules.
function buildStoreChainSteps(store, amount, users) {
  const steps = [];
  const nameOf = id => (users[id] && users[id].name) || "Unknown";

  const acIds = (store.acIds || []).filter(id => users[id]);
  if (acIds.length) {
    steps.push({
      role: "AREA_COACH", label: "District Manager (DM)",
      userIds: acIds, userId: acIds[0],
      name: acIds.map(nameOf).join(" or ")
    });
  }

  if (store.directorId && users[store.directorId]) {
    steps.push({
      role: "DIRECTOR", label: "Director of Ops",
      userIds: [store.directorId], userId: store.directorId,
      name: nameOf(store.directorId),
      note: acIds.length ? undefined : "No District Manager — starts here"
    });
  }

  if (amount >= CFG.vpThreshold) {
    // Sam is also the assigned DIRECTOR for C-Store/car wash stores under a
    // different id; skip the duplicate VP step in THIS chain when he already
    // appears in it.
    const vpIds = [CFG.vp.id, CFG.vp.directoryId].filter(Boolean);
    const already = steps.some(s => s.userIds.some(id => vpIds.includes(id)));
    if (!already) {
      steps.push({
        role: "VP", label: "VP of Ops",
        userIds: [CFG.vp.id], userId: CFG.vp.id, name: CFG.vp.name,
        note: "Invoice total $" + CFG.vpThreshold.toLocaleString() + "+"
      });
    }
  }
  return steps;
}

// Full chain objects for an invoice.
function buildChains(stores, amount, users, now) {
  return stores.map(st => {
    const steps = buildStoreChainSteps(st, amount, users);
    return {
      storeId: st.id,
      storeName: st.name,
      storeNumber: st.storeNumber || "",
      entity: st.entity || "",
      division: st.division || "",
      steps,
      status: steps.length ? "PENDING" : "REJECTED",   // unroutable store fails loudly
      currentStage: steps.length ? steps[0].role : "NONE",
      stageEnteredAt: steps.length ? now : null,
      history: []
    };
  });
}

// Normalized chains for ANY invoice. Legacy single-chain invoices (top-level
// requiredApprovals) are presented as one synthetic chain so old records
// render and route without migration.
function getChains(inv) {
  if (Array.isArray(inv.chains) && inv.chains.length) return inv.chains;
  if (Array.isArray(inv.requiredApprovals) && inv.requiredApprovals.length) {
    return [{
      _legacy: true,
      storeId: inv.storeId || "", storeName: inv.storeName || "",
      storeNumber: "", entity: "", division: inv.division || "",
      steps: inv.requiredApprovals,
      status: inv.status === "PAID" ? "APPROVED" : inv.status,
      currentStage: inv.currentStage,
      stageEnteredAt: inv.stageEnteredAt || null,
      history: inv.history || []
    }];
  }
  return [];
}

// Top-level invoice status derived from its chains.
//   any chain PENDING or HOLD  -> PENDING (still in flight)
//   otherwise ≥1 APPROVED      -> APPROVED (finance pays that subset)
//   otherwise                  -> REJECTED
function deriveStatus(chains) {
  if (chains.some(c => c.status === "PENDING" || c.status === "HOLD")) return "PENDING";
  return chains.some(c => c.status === "APPROVED") ? "APPROVED" : "REJECTED";
}

function chainCurrentStep(chain) {
  return (chain.steps || []).find(s => s.role === chain.currentStage) || null;
}

function canActOnChain(user, chain) {
  if (!user || !chain) return false;
  if (chain.status !== "PENDING") return false;
  const step = chainCurrentStep(chain);
  if (!step) return false;
  return (step.userIds || [step.userId]).includes(user.id);
}

// True when the user can act on at least one chain of the invoice.
function canUserAct(user, inv) {
  if (!inv || inv.status === "PAID") return false;
  return getChains(inv).some(c => canActOnChain(user, c));
}

/* ============================================================
   2b. IDENTITY — email + role password
   The email is resolved against the LIVE directory; the password
   only proves which role you hold. Nobody's identity is hardcoded,
   so people added to the directory can sign in immediately.
   ============================================================ */

function resolveSession(email, pw, dir) {
  const lc = (email || "").trim().toLowerCase();
  if (!lc || !pw) return { error: "Enter your email and password." };

  const P = CFG.rolePasswords;
  const emailOf = o => (o && o.email ? o.email : "").toLowerCase();

  // 1. Admin — full view, can impersonate anyone.
  if (CFG.adminEmails.map(e => e.toLowerCase()).includes(lc)) {
    if (pw !== P.admin) return { error: "That password doesn't match the admin role." };
    return { id: "admin:" + lc, email: lc, name: "IT Support", role: "ADMIN", scope: "all" };
  }

  // 2. Finance / AP. Directory first so that once these people are added
  //    upstream, the live record wins over the fallback list below.
  const dirFinance = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "FINANCE");
  if (dirFinance) {
    if (pw !== P.finance) return { error: "That password doesn't match the finance role." };
    return { id: dirFinance.id, email: lc, name: dirFinance.name, role: "FINANCE", scope: "all" };
  }
  const seeded = CFG.financeUsers.find(u => u.email.toLowerCase() === lc);
  if (seeded) {
    if (pw !== P.finance) return { error: "That password doesn't match the finance role." };
    return { id: "fin:" + lc, email: lc, name: seeded.name, role: "FINANCE", scope: "all" };
  }

  // 3. Director of Ops
  const director = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "DIRECTOR");
  if (director) {
    if (pw !== P.director) return { error: "That password doesn't match the director role." };
    return { id: director.id, email: lc, name: director.name, role: "DIRECTOR", scope: "director" };
  }

  // 4. Area Coach / District Manager
  const coach = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "AREA_COACH");
  if (coach) {
    if (pw !== P.coach) return { error: "That password doesn't match the district manager role." };
    return { id: coach.id, email: lc, name: coach.name, role: "AREA_COACH", scope: "stores" };
  }

  // 5. Store manager — matched on the store's own email address.
  const store = dir.stores.find(s => (s.email || "").toLowerCase() === lc);
  if (store) {
    if (pw !== P.manager) return { error: "That password doesn't match the store role." };
    return { id: "store:" + store.id, email: lc, name: store.storeManager || store.name,
             role: "MANAGER", scope: "single", storeId: store.id };
  }

  return { error: "We couldn't find that email in the directory. Check it's the email on file." };
}

// Impersonated sessions use the SAME shape resolveSession returns, so the
// simulated view is exactly what that person would see.
function buildImpersonatedSession(u, dir) {
  if (u.kind === "store") {
    const s = dir.stores.find(x => x.id === u.id);
    if (!s) return null;
    return { id: "store:" + s.id, email: (s.email || "").toLowerCase(),
             name: s.storeManager || s.name, role: "MANAGER",
             scope: "single", storeId: s.id, _sim: true };
  }
  const person = dir.users[u.id];
  if (!person) return null;
  return { id: person.id, email: (person.email || "").toLowerCase(),
           name: person.name, role: person.role,
           scope: person.role === "DIRECTOR" ? "director" : "stores", _sim: true };
}

// Everyone an admin can view as.
function viewAsRoster(dir) {
  const rows = [];
  Object.values(dir.users).forEach(u => {
    rows.push({ kind: "user", id: u.id, primary: u.name,
                secondary: roleLabel(u.role),
                search: (u.name + " " + (u.email || "") + " " + u.role).toLowerCase() });
  });
  CFG.financeUsers.forEach(f => {
    if (Object.values(dir.users).some(u => (u.email || "").toLowerCase() === f.email.toLowerCase())) return;
    rows.push({ kind: "finance", id: "fin:" + f.email.toLowerCase(), primary: f.name,
                secondary: "Finance", search: (f.name + " " + f.email + " finance").toLowerCase() });
  });
  dir.stores.forEach(s => {
    rows.push({ kind: "store", id: s.id,
                primary: s.storeManager || "(no manager on file)",
                secondary: s.name,
                search: (s.name + " " + s.storeNumber + " " + (s.storeManager || "")).toLowerCase() });
  });
  return rows;
}

/* ============================================================
   3. SLA TIMER — business hours only
   Mon-Fri 08:00-17:00. Nights, weekends and configured holidays
   contribute nothing. The clock is NOT paused or reset by
   comments; it stops only when the approver approves or rejects,
   and restarts from zero for the next approver in the chain.
   Colour is always derived from stageEnteredAt, never stored, so
   it cannot go stale in the database.
   ============================================================ */
const BH = CFG.businessHours;

function isBusinessDay(d) {
  if (!BH.days.includes(d.getDay())) return false;
  const iso = d.getFullYear() + "-" +
              String(d.getMonth() + 1).padStart(2, "0") + "-" +
              String(d.getDate()).padStart(2, "0");
  return !(BH.holidays || []).includes(iso);
}

// Minutes of business time between two instants.
function businessMinutesBetween(from, to) {
  if (to <= from) return 0;
  let mins = 0;
  const cur = new Date(from);
  let guard = 0;
  while (cur < to && guard++ < 4000) {
    if (isBusinessDay(cur)) {
      const open  = new Date(cur); open.setHours(BH.startHour, 0, 0, 0);
      const close = new Date(cur); close.setHours(BH.endHour, 0, 0, 0);
      const s = cur > open ? cur : open;
      const e = to < close ? to : close;
      if (e > s) mins += (e - s) / 60000;
    }
    cur.setDate(cur.getDate() + 1);
    cur.setHours(0, 0, 0, 0);
  }
  return mins;
}

// The instant at which `minutes` of business time will have elapsed.
function addBusinessMinutes(from, minutes) {
  let left = minutes;
  const cur = new Date(from);
  let guard = 0;
  while (left > 0 && guard++ < 4000) {
    if (isBusinessDay(cur)) {
      const open  = new Date(cur); open.setHours(BH.startHour, 0, 0, 0);
      const close = new Date(cur); close.setHours(BH.endHour, 0, 0, 0);
      const s = cur > open ? new Date(cur) : open;
      if (s < close) {
        const avail = (close - s) / 60000;
        if (avail >= left) return new Date(s.getTime() + left * 60000);
        left -= avail;
      }
    }
    cur.setDate(cur.getDate() + 1);
    cur.setHours(0, 0, 0, 0);
  }
  return new Date(from + minutes * 60000);
}

// Hours in one full business day, derived from the configured window.
const BIZ_DAY_HOURS = BH.endHour - BH.startHour;
const SLA_HOURS = CFG.slaDays * BIZ_DAY_HOURS;

function slaState(inv, now) {
  if (!inv.stageEnteredAt || inv.status !== "PENDING") return null;
  const usedH = businessMinutesBetween(new Date(inv.stageEnteredAt), new Date(now)) / 60;
  const remainingH = SLA_HOURS - usedH;
  const dueAt = addBusinessMinutes(new Date(inv.stageEnteredAt), SLA_HOURS * 60);
  let level = "ok";
  if (usedH >= SLA_HOURS) level = "late";
  else if (usedH >= SLA_HOURS / 2) level = "warn";
  // Outside working hours the clock is frozen — worth showing so an approver
  // doesn't think the display is broken.
  const paused = !isBusinessDay(new Date(now)) ||
                 new Date(now).getHours() < BH.startHour ||
                 new Date(now).getHours() >= BH.endHour;
  return {
    usedH, remainingH, level, dueAt, paused,
    usedDays: usedH / BIZ_DAY_HOURS,
    remainingDays: remainingH / BIZ_DAY_HOURS
  };
}

// Everything users see is in business days — never hours.
function dayWord(n) { return n === 1 ? "day" : "days"; }

// Human phrase for the SLA window, used in banners and tooltips.
const SLA_PHRASE = CFG.slaDays + " business " + dayWord(CFG.slaDays);

function slaLabel(s) {
  if (!s) return "";
  if (s.level === "late") {
    const over = s.usedDays - CFG.slaDays;
    if (over < 1) return "Overdue";
    const d = Math.floor(over);
    return d + " " + dayWord(d) + " overdue";
  }
  // Round up so a partly-used day still reads as a day remaining, and never
  // show "0 days left" while the invoice is still inside its window.
  const left = Math.max(1, Math.ceil(s.remainingDays));
  return left + " business " + dayWord(left) + " left";
}

function slaTitle(s) {
  if (!s) return "";
  const due = s.dueAt.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  return "Due " + due + " · " + SLA_PHRASE + " (Mon-Fri " + BH.startHour + ":00-" + BH.endHour + ":00)" +
         (s.paused ? " · clock paused outside working hours" : "");
}

/* ============================================================
   4. INVOICE SERVICE — Firestore
   Same method names as the old Supabase service so the UI that
   gets ported later needs no changes.
   ============================================================ */
const invoiceService = {
  _col() { return window.FS.collection(window.FS.db, "invoices"); },

  subscribe(cb, onErr) {
    const q = window.FS.query(this._col(), window.FS.orderBy("createdAt", "desc"));
    return window.FS.onSnapshot(q,
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err  => onErr && onErr(err));
  },

  async create(inv) {
    const ref = await window.FS.addDoc(this._col(), inv);
    return ref.id;
  },

  async update(id, patch) {
    await window.FS.updateDoc(window.FS.doc(window.FS.db, "invoices", id), patch);
  },

  async remove(id) {
    await window.FS.deleteDoc(window.FS.doc(window.FS.db, "invoices", id));
  }
};

/* ============================================================
   4b. COMMENTS — invoices/{id}/comments subcollection
   Kept out of the invoice document so that a long thread cannot
   push the doc toward Firestore's 1MB ceiling, and so two people
   posting at once don't overwrite each other.
   Commenting never touches stageEnteredAt: the SLA clock is not
   affected by discussion, only by Approve/Reject.
   ============================================================ */
const commentService = {
  _col(invoiceId) {

  subscribe(invoiceId, cb, onErr) {

      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err  => onErr && onErr(err));
  },

  async add(invoiceId, author, text) {
    await window.FS.addDoc(this._col(invoiceId), {
      userId: author.id,
      userName: author.name,
      userRole: author.role,
      text: String(text).trim(),
      ts: Date.now()
    });
  }
};

// The Filestack script is a separate CDN request, so it may not have parsed by
// the time this component first renders. Retry briefly instead of permanently
// deciding uploads are unavailable on the first paint.
function useFilestack() {
  const ref = useRef(null);
  const [, bump] = useState(0);

  useEffect(() => {
    if (ref.current) return;
    let tries = 0;
    const t = setInterval(() => {
      if (window.filestack && CFG.filestackApiKey &&
          !CFG.filestackApiKey.startsWith("PASTE_")) {
        try {
          ref.current = window.filestack.init(CFG.filestackApiKey);
          bump(n => n + 1);
        } catch (e) { /* leave null; the picker reports it */ }
        clearInterval(t);
      } else if (++tries > 40) {          // ~10s
        clearInterval(t);
        bump(n => n + 1);
      }
    }, 250);
    return () => clearInterval(t);
  }, []);

  return ref.current;
}

function LateBanner({ invoices, now }) {
  // Count individual STORE CHAINS past the deadline, since each chain has its
  // own clock. One 4-store invoice can contribute several overdue chains.
  const late = [];
  invoices.forEach(i => {
    getChains(i).forEach(c => {
      if (c.status !== "PENDING") return;
      const s = slaState(c, now);
      if (s && s.level === "late") late.push({ inv: i, chain: c });
    });
  });
  if (!late.length) return null;
  return (
    <div className="mb-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3">
      <div className="flex items-center justify-between gap-4">
        <div>
          <p className="font-semibold text-red-800">
            {late.length} store approval{late.length > 1 ? "s" : ""} past the {SLA_PHRASE} deadline
          </p>
          <p className="text-sm text-red-700">
            {late.slice(0, 3).map(x =>
              x.inv.vendor + " → " + x.chain.storeName).join(" · ")}
            {late.length > 3 ? " and " + (late.length - 3) + " more" : ""}
          </p>
        </div>
      </div>
    </div>
  );
}

// Searchable multi-select store picker. Matches on store number, name,
// entity, division, and manager, so "23086", "atlanta", or "al's" all work.
// Searchable multi-select store picker. Matches on store number, name,
// entity, division, and manager, so "23086", "atlanta", or "al's" all work.
// Selecting clears the typed text and keeps the list open, so adding several
// stores is type → Enter → type → Enter.
function StorePicker({ stores, selectedIds, onChange }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const boxRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    function onDoc(e) {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  const shown = useMemo(() => {
    const t = q.trim().toLowerCase();
    const base = t ? stores.filter(s =>
      (s.name || "").toLowerCase().includes(t) ||
      (s.storeNumber || "").toLowerCase().includes(t) ||
      (s.storeNumber || "").replace(/^#0*/, "").toLowerCase().includes(t.replace(/^#0*/, "")) ||
      (s.entity || "").toLowerCase().includes(t) ||
      (s.division || "").toLowerCase().includes(t) ||
      (s.storeManager || "").toLowerCase().includes(t)) : stores;
    return base;
  }, [q, stores]);

  const selected = stores.filter(s => selectedIds.includes(s.id));

  function toggle(id) {
    onChange(selectedIds.includes(id)
      ? selectedIds.filter(x => x !== id)
      : [...selectedIds, id]);
    setQ("");                                  // no leftover typed text
    if (inputRef.current) inputRef.current.focus();
  }

  function onKey(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      // Enter adds the first match that isn't already selected.
      const first = shown.find(s => !selectedIds.includes(s.id));
      if (first) toggle(first.id);
    } else if (e.key === "Escape") {
      setOpen(false);
    }
  }

  return (
    <div ref={boxRef} className="relative">
      {selected.length > 0 && (
        <div className="mb-2 flex flex-wrap gap-1.5">
          {selected.map(s => (
            <span key={s.id}
              className="inline-flex items-center gap-1.5 rounded-full bg-slate-900 px-2.5 py-1 text-xs text-white">
              <span>{s.storeNumber} {s.name.replace(/#\S+\s*/, "")}</span>
              <button type="button" onClick={() => toggle(s.id)}
                className="text-slate-300 hover:text-white" title="Remove">✕</button>
            </span>
          ))}
        </div>
      )}

      <input ref={inputRef} value={q}
        onFocus={() => setOpen(true)}
        onChange={e => { setQ(e.target.value); setOpen(true); }}
        onKeyDown={onKey}
        placeholder="Type store # or name, press Enter to add"
        className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />

      {open && (
        <div className="absolute z-10 mt-1 max-h-64 w-full overflow-y-auto rounded-lg border
                        border-slate-200 bg-white shadow-lg">
          {shown.length === 0 && (
            <p className="px-3 py-4 text-center text-sm text-slate-400">No stores match.</p>
          )}
          {shown.map((s, si) => {
            const on = selectedIds.includes(s.id);
            const isFirst = !on && shown.find(x => !selectedIds.includes(x.id)) === s;
            return (
              <button type="button" key={s.id} onClick={() => toggle(s.id)}
                className={"flex w-full items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-slate-50 " +
                           (on ? "bg-sky-50 text-sky-900" : "text-slate-800") +
                           (isFirst && q ? " bg-slate-50" : "")}>
                <span className="w-4 shrink-0 text-center text-sky-600">{on ? "✓" : ""}</span>
                <span className="shrink-0 font-medium">{s.storeNumber}</span>
                <span className="min-w-0 truncate">{s.name.replace(/#\S+\s*/, "")}</span>
                <span className="min-w-0 flex-1 truncate text-right text-xs text-slate-400">
                  {s.entity || s.division || ""}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function NewInvoice({ stores, users, currentUser, onDone }) {
  const fs = useFilestack();
  const [storeIds, setStoreIds] = useState([]);
  const [vendor, setVendor]   = useState("");
  const [amount, setAmount]   = useState("");
  const [invoiceNumber, setInvoiceNumber] = useState("");
  const [file, setFile]       = useState(null);
  const [busy, setBusy]       = useState(false);
  const [uploading, setUploading] = useState(false);
  const [err, setErr]         = useState("");

  const selStores = stores.filter(s => storeIds.includes(s.id));
  const amt   = parseFloat(amount) || 0;
  const previewChains = selStores.length ? buildChains(selStores, amt, users, Date.now()) : [];

  function pickFile() {
    setErr("");
    if (!fs) {
      setErr("Upload isn't available — the Filestack script didn't load. Check the network or the API key.");
      return;
    }
    setUploading(true);
    fs.picker({
      accept: ["application/pdf", "image/*"],
      maxFiles: 1,
      fromSources: ["local_file_system", "googledrive", "dropbox", "onedrive"],
      // Files land under the first store so invoices stay traceable in Filestack.
      storeTo: { path: "/invoices/" +
        (selStores.length ? (selStores[0].storeNumber || selStores[0].id) : "unfiled") + "/" },
      onUploadDone: r => {
        setUploading(false);
        const f = r.filesUploaded && r.filesUploaded[0];
        if (f) setFile({ url: f.url, name: f.filename, handle: f.handle, size: f.size });
        else setErr("Nothing was uploaded. Try again.");
      },
      onFileUploadFailed: (f, e) => {
        setUploading(false);
        setErr("Upload failed: " + ((e && e.message) || "unknown error"));
      },
      onClose: () => setUploading(false)
    }).open();
  }

  async function submit() {
    setErr("");
    if (!selStores.length) return setErr("Pick at least one store.");
    if (!vendor.trim())    return setErr("Enter a vendor.");
    if (!(amt > 0))        return setErr("Enter an amount.");

    const now = Date.now();
    const chains = buildChains(selStores, amt, users, now);
    if (chains.every(c => !c.steps.length))
      return setErr("No approvers found for these stores — check the directory.");

    setBusy(true);
    try {
      await invoiceService.create({
        vendor: vendor.trim(),
        amount: amt,
        invoiceNumber: invoiceNumber.trim(),
        storeIds: selStores.map(s => s.id),
        storeNames: selStores.map(s => s.name),
        entities: [...new Set(selStores.map(s => s.entity).filter(Boolean))],
        storeId: selStores[0].id,
        storeName: selStores.map(s => s.name).join(" + "),
        division: [...new Set(selStores.map(s => s.division))].join(" / "),
        // One independent chain per store.
        chains,
        status: deriveStatus(chains),
        fileUrl: file ? file.url : null,
        fileName: file ? file.name : null,
        createdAt: now,
        updatedAt: now,
        createdBy: currentUser.id,
        createdByName: currentUser.name
      });
      setVendor(""); setAmount(""); setInvoiceNumber(""); setFile(null); setStoreIds([]);
      onDone && onDone();
    } catch (e) {
      setErr(e.message || "Could not save.");
    } finally {
      setBusy(false);
    }
  }

  // Deadline for the whole path: step 1 gets the SLA window from submission,
  // step 2 gets it from step 1's deadline, and so on. Recomputed live so the
  // dates shown are what the approvers will actually face.
  function pathWithDeadlines(steps) {
    let from = new Date();
    return steps.map(s => {
      const dueAt = addBusinessMinutes(from, SLA_HOURS * 60);
      from = dueAt;
      return { ...s, dueAt };
    });
  }
  const fmtDue = d => d.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

  return (
    <div className="grid gap-5 xl:grid-cols-[1fr_minmax(460px,620px)_1fr]">

      {/* LEFT RAIL — the approval path, with the SLA window and the projected
          date/time between each approver. */}
      <div className="order-2 xl:order-1 xl:col-start-1 xl:row-start-1">
        <div className="rounded-xl border bg-white p-5 shadow-sm xl:sticky xl:top-4">
          <h3 className="text-sm font-semibold uppercase tracking-wide text-slate-500">
            Approval path
          </h3>
          {selStores.length === 0 ? (
            <p className="mt-3 text-sm text-slate-400">
              Pick a store and the route will map out here — who signs, in what
              order, and by when.
            </p>
          ) : (
            <div className="mt-3 space-y-5">
              {previewChains.map((c, ci) => (
                <div key={ci}>

function CommentThread({ invoiceId, currentUser, canPost }) {
  const [items, setItems] = useState(null);
  const [text, setText]   = useState("");
  const [busy, setBusy]   = useState(false);
  const [err, setErr]     = useState("");

  useEffect(() => {
    if (!window.FS) return;
    const unsub = commentService.subscribe(invoiceId, setItems,
      e => setErr(e.message || "Couldn't load comments."));
    return () => unsub && unsub();
  }, [invoiceId]);

  async function post() {
    const t = text.trim();
    if (!t) return;
    setBusy(true); setErr("");
    try {
      await commentService.add(invoiceId, currentUser, t);
      setText("");
    } catch (e) {
      setErr(e.message || "Couldn't post.");
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="mt-3 border-t pt-3">
      <p className="text-xs font-medium uppercase tracking-wide text-slate-500">
        Discussion{items && items.length ? " (" + items.length + ")" : ""}
      </p>

      {items === null && <p className="mt-2 text-sm text-slate-400">Loading…</p>}
      {items && items.length === 0 && (
        <p className="mt-2 text-sm text-slate-400">No comments yet.</p>
      )}

      {items && items.length > 0 && (
        <ul className="mt-2 space-y-2">
          {items.map(c => {
            const me = c.userId === currentUser.id;
            return (
              <li key={c.id}
                  className={"rounded-lg px-3 py-2 " + (me ? "bg-sky-50" : "bg-slate-50")}>
                <div className="flex flex-wrap items-baseline gap-2">
                  <span className="text-sm font-medium text-slate-800">{c.userName}</span>
                  <span className="text-xs text-slate-400">
                    {roleLabel(c.userRole)} · {new Date(c.ts).toLocaleString()}
                  </span>
                </div>
                <p className="mt-0.5 whitespace-pre-wrap text-sm text-slate-700">{c.text}</p>
              </li>
            );
          })}
        </ul>
      )}

      {err && <p className="mt-2 text-sm text-red-700">{err}</p>}

      {canPost ? (
        <div className="mt-2 flex gap-2">
          <input value={text} onChange={e => setText(e.target.value)}
                 onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); post(); } }}
                 placeholder="Ask a question or add context…"
                 className="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm" />
          <button onClick={post} disabled={busy || !text.trim()}
            className="rounded-lg bg-slate-900 px-3 py-2 text-sm font-medium text-white disabled:opacity-40">
            {busy ? "…" : "Post"}
          </button>
        </div>
      ) : (
        <p className="mt-2 text-xs text-slate-400">
          Return to your own account to post.
        </p>
      )}

      <p className="mt-2 text-xs text-slate-400">
        Comments don't pause the approval clock.
      </p>
    </div>
  );
}

function ChainCard({ inv, chain, chainIdx, currentUser, now, onAct, canFinance }) {
  const [note, setNote] = useState("");
  const sla  = chain.status === "PENDING" ? slaState(chain, now) : null;
  const mine = canActOnChain(currentUser, chain) && !currentUser._sim;
  const step = chainCurrentStep(chain);

  const badge =
    chain.status === "APPROVED" ? <Pill tone="ok">Approved</Pill> :
    chain.status === "REJECTED" ? <Pill tone="late">Rejected</Pill> :
    chain.status === "HOLD"     ? <span className="rounded-full border border-violet-300 bg-violet-50 px-2 py-0.5 text-xs font-medium text-violet-700">On hold</span> :
    sla ? <span title={slaTitle(sla)}><Pill tone={sla.level} pulse={sla.level === "late"}>{slaLabel(sla)}{sla.paused ? " ⏸" : ""}</Pill></span> : null;

  return (
    <div className={"rounded-lg border px-3 py-2 " +
      (chain.status === "APPROVED" ? "border-emerald-200 bg-emerald-50/40" :
       chain.status === "REJECTED" ? "border-red-200 bg-red-50/40" :
       chain.status === "HOLD"     ? "border-violet-200 bg-violet-50/40" :
       "border-slate-200 bg-white")}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div className="min-w-0">
          <p className="truncate text-sm font-medium text-slate-900">{chain.storeName}</p>
          <p className="truncate text-xs text-slate-500">
            {[chain.division, chain.entity].filter(Boolean).join(" · ") || "—"}
          </p>
        </div>
        {badge}
      </div>

      {chain.status === "PENDING" && step && (
        <p className="mt-1 text-xs text-slate-600">
          Waiting on <span className="font-medium">{step.label}</span> — {step.name}
        </p>
      )}

      {/* Step trail for this chain */}
      <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5 text-xs">
        {(chain.steps || []).map((s, si) => {
          const done = (chain.history || []).some(h => h.stage === s.role && h.action === "APPROVE");
          const rejectedHere = (chain.history || []).some(h => h.stage === s.role && h.action === "REJECT");
          const cur = chain.currentStage === s.role && chain.status === "PENDING";
          return (
            <span key={si}
              className={rejectedHere ? "text-red-600" : done ? "text-emerald-600" :
                         cur ? "font-medium text-slate-800" : "text-slate-400"}>
              {rejectedHere ? "✗" : done ? "✓" : cur ? "→" : "•"} {s.label}
            </span>
          );
        })}
      </div>

      {(chain.history || []).length > 0 && (
        <ul className="mt-1.5 space-y-0.5">
          {chain.history.map((h, hi) => (
            <li key={hi} className="text-xs text-slate-500">
              <span className="font-medium text-slate-600">{h.byName}</span>{" "}
              {h.action === "APPROVE" ? "approved" : h.action === "REJECT" ? "rejected" :
               h.action === "HOLD" ? "put on hold" : h.action === "RESUME" ? "resumed" : h.action.toLowerCase()}{" "}
              · {new Date(h.ts).toLocaleString()}
              {h.note && <span className="block pl-2 italic">"{h.note}"</span>}
            </li>
          ))}
        </ul>
      )}

      {mine && (
        <div className="mt-2 border-t border-slate-200 pt-2">
          <input value={note} onChange={e => setNote(e.target.value)}
            placeholder="Note for this store (optional)"
            className="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm" />
          <div className="mt-1.5 flex flex-wrap gap-2">
            <button onClick={() => { onAct(inv, chainIdx, "APPROVE", note); setNote(""); }}
              className="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-700">
              Approve
            </button>
            <button onClick={() => { onAct(inv, chainIdx, "HOLD", note); setNote(""); }}
              className="rounded-lg bg-violet-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-violet-700">
              Hold
            </button>
            <button onClick={() => { onAct(inv, chainIdx, "REJECT", note); setNote(""); }}
              className="rounded-lg bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-700">
              Reject
            </button>
          </div>
        </div>
      )}

      {chain.status === "HOLD" && canFinance && (
        <button onClick={() => onAct(inv, chainIdx, "RESUME", "")}
          className="mt-2 rounded-lg border border-violet-300 bg-white px-3 py-1.5 text-sm font-medium text-violet-700 hover:bg-violet-50">
          Put back in queue
        </button>
      )}
    </div>
  );
}

function InvoiceRow({ inv, users, currentUser, now, onAct, onMarkPaid, canFinance }) {
  const [open, setOpen] = useState(false);
  const chains = getChains(inv);
  const mineAny = canUserAct(currentUser, inv) && !currentUser._sim;

  const approved = chains.filter(c => c.status === "APPROVED").length;
  const rejected = chains.filter(c => c.status === "REJECTED").length;
  const resolved = chains.every(c => c.status === "APPROVED" || c.status === "REJECTED");

  // Most urgent SLA across pending chains for the card-level pill.
  const worst = chains
    .filter(c => c.status === "PENDING")
    .map(c => slaState(c, now)).filter(Boolean)
    .sort((a, b) => a.remainingH - b.remainingH)[0] || null;

  const showChains = open || mineAny;   // auto-expand when it is your turn

  return (
    <div className="rounded-xl border bg-white p-4 shadow-sm">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="flex flex-wrap items-center gap-2">
            <p className="font-medium text-slate-900">{inv.vendor}</p>
            <span className="text-sm text-slate-500">
              ${Number(inv.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}
            </span>
            {inv.status === "PENDING" && worst && (
              <span title={slaTitle(worst)}>
                <Pill tone={worst.level} pulse={worst.level === "late"}>
                  {slaLabel(worst)}{worst.paused ? " ⏸" : ""}
                </Pill>
              </span>
            )}
            {inv.status === "PAID" && <Pill tone="ok">Paid</Pill>}
            {inv.status === "APPROVED" && (
              <Pill tone="ok">{approved} of {chains.length} approved</Pill>
            )}
            {inv.status === "REJECTED" && <Pill tone="late">All chains rejected</Pill>}
            {chains.length > 1 && inv.status === "PENDING" && (approved > 0 || rejected > 0) && (
              <span className="text-xs text-slate-500">
                {approved} approved · {rejected} rejected · {chains.length - approved - rejected} pending
              </span>
            )}
          </div>
          <p className="mt-1 truncate text-sm text-slate-500">
            {chains.length} store{chains.length > 1 ? "s" : ""}
            {inv.invoiceNumber ? " · #" + inv.invoiceNumber : ""}
            {inv.createdByName ? " · by " + inv.createdByName : ""}
          </p>
        </div>

        <div className="flex items-center gap-2">
          {inv.fileUrl && (
            <a href={inv.fileUrl} target="_blank" rel="noopener noreferrer"
               className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
              View PDF
            </a>
          )}
          <button onClick={() => setOpen(o => !o)}
            className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
            {showChains ? "Hide" : "Details"}
          </button>
        </div>
      </div>

      {/* When expanded: approval path on the LEFT, document preview on the
          RIGHT, side by side — approvers read the invoice while they sign. */}
      {showChains && (
        <div className={"mt-3 grid gap-4 " + (inv.fileUrl ? "lg:grid-cols-2" : "")}>
          <div className="space-y-2">
            {chains.map((c, ci) => (
              <ChainCard key={ci} inv={inv} chain={c} chainIdx={ci}
                         currentUser={currentUser} now={now} onAct={onAct}
                         canFinance={canFinance} />
            ))}
            {!inv.fileUrl && (
              <p className="rounded-lg border border-dashed border-slate-300 px-3 py-2 text-xs text-slate-400">
                No file attached to this invoice.
              </p>
            )}
          </div>

          {inv.fileUrl && (
            <div className="lg:sticky lg:top-4 lg:self-start">
              <div className="overflow-hidden rounded-lg border border-slate-200 bg-white">
                {/\.(png|jpe?g|gif|webp)(\?|$)/i.test(inv.fileUrl) ? (
                  <div className="max-h-[520px] overflow-y-auto bg-slate-100">
                    <img src={inv.fileUrl} alt={inv.fileName || "invoice"} className="w-full" />
                  </div>
                ) : (
                  <iframe src={inv.fileUrl} title={inv.fileName || "invoice preview"}
                          className="h-[520px] w-full bg-slate-100" />
                )}
                <div className="flex items-center justify-between border-t bg-slate-50 px-3 py-1.5">
                  <span className="truncate text-xs text-slate-500">{inv.fileName || "Attached file"}</span>
                  <a href={inv.fileUrl} target="_blank" rel="noopener noreferrer"
                     className="shrink-0 text-xs font-medium text-sky-700 hover:underline">
                    Open full size ↗
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Finance processes payment once every chain has resolved. Pays the
          approved subset — "3 of 4" is a normal outcome, not an error. */}
      {canFinance && inv.status === "APPROVED" && resolved && approved > 0 && (
        <div className="mt-3 flex flex-wrap items-center gap-3 rounded-lg bg-emerald-50 p-3">
          <p className="text-sm text-emerald-800">
            {approved === chains.length
              ? "All " + chains.length + " store" + (chains.length > 1 ? "s" : "") + " approved."
              : approved + " of " + chains.length + " stores approved — pay the approved stores only."}
          </p>
          <button onClick={() => onMarkPaid(inv)}
            className="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
            Mark paid
          </button>
        </div>
      )}

      {(open || mineAny) && (
        <CommentThread invoiceId={inv.id} currentUser={currentUser}
                       canPost={!currentUser._sim} />
      )}
    </div>
  );
}

function App() {
  const [ready, setReady]       = useState(false);
  const [dir, setDir]           = useState({ users: {}, stores: [] });
  const [session, setSession]   = useState(null);
  const [realSession, setReal]  = useState(null);   // admin's true session while impersonating
  const [showViewAs, setShowVA] = useState(false);
  const [invoices, setInvoices] = useState([]);
  const [tab, setTab]           = useState("inbox");
  const [err, setErr]           = useState("");
  const [now, setNow]           = useState(Date.now());
  const [filters, setFilters]   = useState({ status: "", division: "", store: "", approver: "", q: "" });

  // Directory load, then silently restore a saved session against the LIVE
  // directory so a person removed upstream loses access on next load.
  useEffect(() => {
    directoryService.load()
      .then(d => {
        setDir(d); setReady(true);
        try {
          const saved = JSON.parse(localStorage.getItem("ap_session") || "null");
          if (saved && saved.email && saved.pw) {
            const s = resolveSession(saved.email, saved.pw, d);
            if (!s.error) setSession(s);
            else localStorage.removeItem("ap_session");
          }
        } catch (e) { /* ignore malformed */ }
      })
      .catch(e => { setErr("Directory: " + e.message); setReady(true); });
  }, []);

  useEffect(() => {
    let unsub;
    function start() {
      unsub = invoiceService.subscribe(setInvoices, e => setErr("Firestore: " + e.message));
    }
    if (window.FS) start();
    else window.addEventListener("firebase-ready", start, { once: true });
    return () => unsub && unsub();
  }, []);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 60000);
    return () => clearInterval(t);
  }, []);

  function signIn(sess, creds) {
    setSession(sess);
    try { localStorage.setItem("ap_session", JSON.stringify(creds)); } catch (e) {}
  }

  function signOut() {
    setSession(null); setReal(null);
    try { localStorage.removeItem("ap_session"); } catch (e) {}
  }

  function startViewAs(row) {
    const sim = buildImpersonatedSession(row, dir);
    if (!sim) { setErr("Couldn't load that view."); return; }
    if (!realSession) setReal(session);   // remember the real admin session once
    setSession(sim);
    setShowVA(false);
    setTab("inbox");
  }

  function returnToMyAccount() {
    if (!realSession) return;
    setSession(realSession);
    setReal(null);
    setTab("inbox");
  }

  // --- Derived values -------------------------------------------------------
  // These must be computed BEFORE any early return. React requires the same
  // number of hooks on every render, so a useMemo placed after the loading/login
  // returns would run only once a session exists and crash with error #310.
  const isAdmin   = !!session && session.role === "ADMIN";
  const isFinance = !!session && session.role === "FINANCE";
  const canSeeAll = isAdmin || isFinance;

  // Finance and admin see everything; everyone else sees only what touches them.
  const visible = useMemo(() => {
    if (!session) return [];
    if (canSeeAll) return invoices;
    return invoices.filter(i =>
      getChains(i).some(c => (c.steps || []).some(s => (s.userIds || []).includes(session.id))) ||
      i.createdBy === session.id ||
      (session.storeId && (i.storeId === session.storeId ||
        (i.storeIds || []).includes(session.storeId))));
  }, [invoices, session, canSeeAll]);

  // Filters apply to the finance/admin dashboard only.
  const filtered = useMemo(() => {
    if (!canSeeAll) return visible;
    const q = (filters.q || "").trim().toLowerCase();
    return visible.filter(i => {
      if (filters.status && i.status !== filters.status) return false;
      if (filters.division && i.division !== filters.division) return false;
      if (filters.store && i.storeId !== filters.store &&
          !(i.storeIds || []).includes(filters.store)) return false;
      if (filters.approver && !getChains(i).some(c => (c.steps || [])
            .some(s => (s.userIds || []).includes(filters.approver)))) return false;
      if (q && !((i.vendor || "").toLowerCase().includes(q) ||
                 (i.invoiceNumber || "").toLowerCase().includes(q) ||
                 (i.storeName || "").toLowerCase().includes(q))) return false;
      return true;
    });
  }, [visible, filters, canSeeAll]);

  // --- Early returns (no hooks may appear below this line) ------------------
  if (!ready)   return <p className="p-8 text-slate-500">Loading directory…</p>;
  if (!session) return <Login dir={dir} onSignIn={signIn} />;

  const mine    = visible.filter(i => canUserAct(session, i));
  const pending = visible.filter(i => i.status === "PENDING");
  const done    = visible.filter(i => i.status !== "PENDING");

  const shown = canSeeAll
    ? (tab === "inbox" ? filtered.filter(i => canUserAct(session, i)) : filtered)
    : (tab === "inbox" ? mine : tab === "pending" ? pending : done);

  // Only Finance/AP and admin raise invoices.
  const canCreate = canSeeAll;

  return (
    <div className="w-full p-4 sm:p-6">
      <div className="mx-auto max-w-6xl">
      {session._sim && <SimBanner session={session} onReturn={returnToMyAccount} />}

      <header className="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-lg font-semibold text-slate-900">AP Invoice Routing</h1>
          <p className="text-sm text-slate-500">
            {session.name} · {roleLabel(session.role)}
          </p>
        </div>
        <div className="flex gap-2">
          {(isAdmin || (realSession && realSession.role === "ADMIN")) && !session._sim && (
            <button onClick={() => setShowVA(true)}
              className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
              View as…
            </button>
          )}
          <button onClick={signOut}
            className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
            Sign out
          </button>
        </div>
      </header>

      {showViewAs && (
        <ViewAsModal dir={dir} onPick={startViewAs} onClose={() => setShowVA(false)} />
      )}

      {err && (
        <div className="mb-4 rounded-lg border border-amber-300 bg-amber-50 px-4 py-2 text-sm text-amber-800">
          {err}
        </div>
      )}

      <LateBanner invoices={pending} now={now} />

      {canSeeAll && (
        <FinanceDashboard invoices={visible} stores={dir.stores} users={dir.users}
                          filters={filters} setFilters={setFilters} />
      )}

      </div>

      {/* Full-bleed: the approval path uses the left rail, the document
          preview the right rail. */}
      {canCreate && !session._sim && (
        <div className="mb-4">
          <NewInvoice stores={dir.stores} users={dir.users} currentUser={session} />
        </div>
      )}

      <div className="mx-auto max-w-6xl">

      {/* Finance gets two views; approvers get the simpler three-tab split.
          Finance and admin also get a Settings tab. */}
      <nav className="mb-3 flex gap-1 rounded-lg bg-slate-200 p-1 text-sm">
        {(canSeeAll
          ? [["inbox", "Needs me (" + mine.length + ")"],
             ["all",   "All invoices (" + filtered.length + ")"],
             ["settings", "Settings"]]
          : [["inbox",   "Needs me (" + mine.length + ")"],
             ["pending", "All pending (" + pending.length + ")"],
             ["done",    "Closed (" + done.length + ")"]]
        ).map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)}
            className={"flex-1 rounded-md px-3 py-1.5 font-medium " +
              (tab === k ? "bg-white text-slate-900 shadow-sm" : "text-slate-600")}>
            {label}
          </button>
        ))}
      </nav>

      {tab === "settings" && canSeeAll ? (
        <SettingsPanel />
      ) : (
      <div className="space-y-3">
        {shown.length === 0 && (
          <p className="rounded-xl border border-dashed bg-white p-8 text-center text-sm text-slate-500">
            {tab === "inbox" ? "Nothing waiting on you." : "No invoices match these filters."}
          </p>
        )}
        {shown.map(inv => (
          <InvoiceRow key={inv.id} inv={inv} users={dir.users} currentUser={session}
                      now={now} onAct={act} onMarkPaid={markPaid}
                      canFinance={canSeeAll && !session._sim} />
        ))}
      </div>
      )}
      </div>
    </div>
  );

  async function act(inv, chainIdx, action, note) {
    // An impersonated session must never write — it is a view, not a login.
    if (session._sim) { setErr("You're viewing as someone else. Return to your account to act."); return; }

    const chains = getChains(inv).map(c => ({ ...c, history: [...(c.history || [])] }));
    const chain = chains[chainIdx];
    if (!chain) return;
    if (chain._legacy) { setErr("This invoice predates per-store chains. Ask IT to migrate or re-file it."); return; }

    const ts = Date.now();
    chain.history.push({ stage: chain.currentStage, by: session.id, byName: session.name,
                         action, note: note || "", ts });

    if (action === "REJECT") {
      chain.status = "REJECTED"; chain.stageEnteredAt = null;
    } else if (action === "HOLD") {
      chain.status = "HOLD"; chain.stageEnteredAt = null;
    } else if (action === "RESUME") {
      chain.status = "PENDING"; chain.stageEnteredAt = ts;
    } else if (action === "APPROVE") {
      const idx = chain.steps.findIndex(s => s.role === chain.currentStage);
      const next = chain.steps[idx + 1];
      if (next) {
        chain.currentStage = next.role;
        chain.stageEnteredAt = ts;         // clock resets for the next approver
      } else {
        chain.status = "APPROVED";
        chain.currentStage = "APPROVED";
        chain.stageEnteredAt = null;
      }
    }

    await invoiceService.update(inv.id, {
      chains,
      status: deriveStatus(chains),
      updatedAt: ts
    });
  }

  async function markPaid(inv) {
    if (session._sim) { setErr("You're viewing as someone else. Return to your account to act."); return; }
    const ts = Date.now();
    await invoiceService.update(inv.id, {
      status: "PAID", paidAt: ts, updatedAt: ts,
      paidBy: session.id, paidByName: session.name
    });
  }
}

function Shell() {
  return (
    <div className="flex min-h-screen flex-col">
      <div className="flex-1"><App /></div>
      <footer className="border-t bg-white px-4 py-3 text-center text-xs text-slate-400">
        AP Invoice Routing · v{CFG.version} · Dossani Paradise
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell />);
</script>
</body>
</html>
