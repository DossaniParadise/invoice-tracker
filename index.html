<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(window.APP_CONFIG.firebase);
// Auto-detect long polling: corporate proxies and some browser extensions
// block Firestore's default streaming transport, which makes writes hang
// forever with no error. This falls back automatically.
const db  = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

// Exposed for the Babel-compiled script below (module scope is isolated).
window.FS = {
  db, collection, doc, addDoc, updateDoc, deleteDoc, setDoc,
  onSnapshot, query, orderBy, serverTimestamp
};
window.dispatchEvent(new Event("firebase-ready"));
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const CFG = window.APP_CONFIG;

// Human-readable role names. The AREA_COACH key is kept internally (it is in
// the directory mapping and in stored invoices) but is never shown to users —
// the org now calls this role District Manager.
const ROLE_LABELS = {
  ADMIN: "Admin", FINANCE: "Finance", DIRECTOR: "Director of Ops",
  AREA_COACH: "District Manager", VP: "VP of Ops", MANAGER: "Store Manager",
  RATE_REVIEWER: "Rate Reviewer", RATE_REVIEW: "Rate Verification"
};
function roleLabel(r) { return ROLE_LABELS[r] || (r || "").replace(/_/g, " "); }

/* ============================================================
   1. DIRECTORY ADAPTER
   Maps the alignment API onto the shapes the UI expects.
   Nothing is hardcoded: every approver is resolved from the API.
   ============================================================ */

// Division is not a field in the directory, so it is derived from the store
// name. Car Wash is tested FIRST — "Paradise Car Wash #1" would otherwise be
// caught by the Paradise/C-Store rule. Anything unmatched surfaces as
// "Unknown" rather than silently defaulting, so new store types get noticed.
function deriveDivision(storeName) {
  const n = (storeName || "").toLowerCase();
  if (n.includes("car wash")) return "Car Wash";
  if (n.startsWith("burger king") || n.startsWith("subway")) return "Fast Food";
  if (n.startsWith("paradise quick stop") ||
      n.startsWith("scarborough travel stop") ||
      n.startsWith("7-eleven")) return "C-Store";
  return "Unknown";
}

// The directory has two record generations:
//   newer DFW stores -> assignedAreaCoachId  (string, sometimes "")
//   older stores     -> assignedAreaCoachIds (array) AND the singular field
// Reading only the plural field silently drops the AC on ~45 DFW stores.
function readCoachIds(rest) {
  const plural = rest.assignedAreaCoachIds;
  if (Array.isArray(plural) && plural.length) return plural.filter(Boolean);
  const single = rest.assignedAreaCoachId;
  return single ? [single] : [];
}

const directoryService = {
  async load() {
    const bust = (CFG.directoryUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
    const res = await fetch(CFG.directoryUrl + bust, { cache: "no-store" });
    if (!res.ok) throw new Error("Directory API " + res.status);
    const data = await res.json();

    const coaches   = data.areaCoaches || {};
    const directors = data.directors   || {};
    const rests     = data.restaurants || {};

    // Flat user map: id -> { id, name, email, role }
    const users = {};
    Object.values(directors).forEach(d => {
      users[d.id] = { id: d.id, name: d.name, email: d.email || "", role: "DIRECTOR" };
    });
    Object.values(coaches).forEach(c => {
      // A person can appear as both; DIRECTOR already registered wins for role,
      // but we still want them selectable as an Area Coach approver.
      if (!users[c.id]) {
        users[c.id] = { id: c.id, name: c.name, email: c.email || "", role: "AREA_COACH" };
      }
    });
    // There is no VP role in the directory, so register the VP from config.
    // If that id already exists (Sam is also a Director), keep the existing
    // record and just note the extra role rather than overwriting it.
    if (users[CFG.vp.id]) {
      users[CFG.vp.id].alsoVP = true;
    } else {
      users[CFG.vp.id] = { id: CFG.vp.id, name: CFG.vp.name, email: CFG.vp.email, role: "VP" };
    }

    const stores = Object.values(rests).map(r => ({
      id: r.id,
      name: r.storeName || "(unnamed)",
      storeNumber: r.storeNumber || "",
      division: deriveDivision(r.storeName),
      acIds: readCoachIds(r),
      directorId: r.assignedDirectorId || null,
      storeManager: r.storeManager || "",
      email: r.email || "",          // store mailbox — managers sign in with this
      entity: r.entity || "",        // legal entity, e.g. "Al's Quick Stop Inc."
      address: r.address || ""
    })).sort((a, b) => a.name.localeCompare(b.name));

    return { users, stores };
  }
};

/* ============================================================
   2. APPROVAL CHAINS — one INDEPENDENT chain per store.

   A 4-store invoice carries 4 chains. Each chain runs its own
   AC -> DO (-> VP) sequence with its own status, current stage,
   SLA clock, and history. One chain rejecting does not touch the
   others: 3 of 4 stores can approve while the 4th rejects, and
   Finance processes payment for the approved subset.

   Within a step, ANY listed user may approve (two-coach stores).
   The VP threshold applies to the invoice TOTAL, and when it
   triggers, the VP step appears in EVERY chain — so the VP can
   approve some stores and reject others.
   ============================================================ */

/* Vendor -> rate-review category: "IT" | "RAHIM" | "NONE".
   Firestore doc (config/vendorRules) wins; then the config seeds; then the
   default. Vendor names compare case-insensitively, trimmed. */
function vendorRuleFor(vendor, rulesDoc) {
  const v = (vendor || "").trim().toLowerCase();
  if (!v) return CFG.vendorRuleDefault;
  const fromDoc = rulesDoc && rulesDoc.rules && rulesDoc.rules[v];
  if (fromDoc) return fromDoc;
  if (CFG.vendorRuleSeeds[v]) return CFG.vendorRuleSeeds[v];
  return (rulesDoc && rulesDoc.default) || CFG.vendorRuleDefault;
}

// Who may sign the rate step. IT can act from the dedicated rate login OR
// their existing admin session (admin ids are "admin:<email>").
function rateReviewerIds(kind) {
  const r = CFG.rateReviewers[kind];
  if (!r) return null;
  const ids = [r.id];
  if (CFG.adminEmails.map(e => e.toLowerCase()).includes(r.email.toLowerCase()))
    ids.push("admin:" + r.email.toLowerCase());
  return { ids, name: r.name };
}

// Steps for ONE store. DM -> (rate check) -> DO -> VP when the total demands.
function buildStoreChainSteps(store, amount, users, vendorRule) {
  const steps = [];
  const nameOf = id => (users[id] && users[id].name) || "Unknown";

  const acIds = (store.acIds || []).filter(id => users[id]);
  if (acIds.length) {
    steps.push({
      role: "AREA_COACH", label: "District Manager (DM)",
      userIds: acIds, userId: acIds[0],
      name: acIds.map(nameOf).join(" or "),
      note: "Has this work been completed?"
    });
  }

  // Rate verification: vendor-dependent second signer, before the DO.
  const reviewer = rateReviewerIds(vendorRule);
  if (reviewer) {
    steps.push({
      role: "RATE_REVIEW", label: "Rate Verification",
      userIds: reviewer.ids, userId: reviewer.ids[0],
      name: reviewer.name,
      note: "Is this rate correct?"
    });
  }

  if (store.directorId && users[store.directorId]) {
    const dirStep = {
      role: "DIRECTOR", label: "Director of Ops",
      userIds: [store.directorId], userId: store.directorId,
      name: nameOf(store.directorId)
    };
    if (!acIds.length) dirStep.note = "No District Manager — starts here";
    steps.push(dirStep);
  }

  if (amount >= CFG.vpThreshold) {
    // Sam is also the assigned DIRECTOR for C-Store/car wash stores under a
    // different id; skip the duplicate VP step in THIS chain when he already
    // appears in it.
    const vpIds = [CFG.vp.id, CFG.vp.directoryId].filter(Boolean);
    const already = steps.some(s => s.userIds.some(id => vpIds.includes(id)));
    if (!already) {
      steps.push({
        role: "VP", label: "VP of Ops",
        userIds: [CFG.vp.id], userId: CFG.vp.id, name: CFG.vp.name,
        note: "Invoice total $" + CFG.vpThreshold.toLocaleString() + "+"
      });
    }
  }
  return steps;
}

// Full chain objects for an invoice.
function buildChains(stores, amount, users, now, vendorRule) {
  return stores.map(st => {
    const steps = buildStoreChainSteps(st, amount, users, vendorRule);
    return {
      storeId: st.id,
      storeName: st.name,
      storeNumber: st.storeNumber || "",
      entity: st.entity || "",
      division: st.division || "",
      steps,
      status: steps.length ? "PENDING" : "REJECTED",   // unroutable store fails loudly
      currentStage: steps.length ? steps[0].role : "NONE",
      stageEnteredAt: steps.length ? now : null,
      history: []
    };
  });
}

// Normalized chains for ANY invoice. Legacy single-chain invoices (top-level
// requiredApprovals) are presented as one synthetic chain so old records
// render and route without migration.
function getChains(inv) {
  if (Array.isArray(inv.chains) && inv.chains.length) return inv.chains;
  if (Array.isArray(inv.requiredApprovals) && inv.requiredApprovals.length) {
    return [{
      _legacy: true,
      storeId: inv.storeId || "", storeName: inv.storeName || "",
      storeNumber: "", entity: "", division: inv.division || "",
      steps: inv.requiredApprovals,
      status: inv.status === "PAID" ? "APPROVED" : inv.status,
      currentStage: inv.currentStage,
      stageEnteredAt: inv.stageEnteredAt || null,
      history: inv.history || []
    }];
  }
  return [];
}

/* ============================================================
   COMMENT NOTIFICATIONS
   Each comment appends {ts, by} to a small commentLog on the
   invoice doc; commentReads holds each person's explicit
   mark-read timestamp. Both PayMi and the repair app compute
   unread identically from the invoice doc alone.
   Audience: everyone named in a PENDING or REJECTED chain.
   Your own comments never count as unread for you.
   ============================================================ */
function commentAudienceIncludes(userId, inv) {
  return getChains(inv).some(c =>
    (c.status === "PENDING" || c.status === "REJECTED") &&
    (c.steps || []).some(st => (st.userIds || []).includes(userId)));
}

function unreadCommentsFor(userId, inv) {
  if (!userId || !commentAudienceIncludes(userId, inv)) return 0;
  const readAt = (inv.commentReads || {})[userId] || 0;
  return (inv.commentLog || []).filter(e =>
    e && e.by !== userId && (e.ts || 0) > readAt).length;
}

// Top-level invoice status derived from its chains.
//   any chain PENDING          -> PENDING (still in flight)
//   otherwise ≥1 APPROVED      -> APPROVED (finance pays that subset)
//   otherwise                  -> REJECTED
function deriveStatus(chains) {
  if (chains.some(c => c.status === "PENDING")) return "PENDING";
  return chains.some(c => c.status === "APPROVED") ? "APPROVED" : "REJECTED";
}

function chainCurrentStep(chain) {
  return (chain.steps || []).find(s => s.role === chain.currentStage) || null;
}

function canActOnChain(user, chain) {
  if (!user || !chain) return false;
  if (chain.status !== "PENDING") return false;
  const step = chainCurrentStep(chain);
  if (!step) return false;
  return (step.userIds || [step.userId]).includes(user.id);
}

// True when the user can act on at least one chain of the invoice.
function canUserAct(user, inv) {
  if (!inv || inv.status === "PAID") return false;
  return getChains(inv).some(c => canActOnChain(user, c));
}

/* ============================================================
   2b. IDENTITY — email + role password
   The email is resolved against the LIVE directory; the password
   only proves which role you hold. Nobody's identity is hardcoded,
   so people added to the directory can sign in immediately.
   ============================================================ */

function resolveSession(email, pw, dir) {
  const lc = (email || "").trim().toLowerCase();
  if (!lc || !pw) return { error: "Enter your email and password." };

  const P = CFG.rolePasswords;
  const emailOf = o => (o && o.email ? o.email : "").toLowerCase();

  // 1. Admin — full view, can impersonate anyone.
  if (CFG.adminEmails.map(e => e.toLowerCase()).includes(lc)) {
    if (pw !== P.admin) return { error: "That password doesn't match the admin role." };
    return { id: "admin:" + lc, email: lc, name: "IT Support", role: "ADMIN", scope: "all" };
  }

  // 1b. Rahim — rate reviewer on most vendors. Same password as admin per
  //     request, but a separate, non-admin session whose id matches the id
  //     that chains embed for the rate step.
  if (lc === CFG.rateReviewers.RAHIM.email.toLowerCase()) {
    if (pw !== P.admin) return { error: "That password doesn't match this role." };
    return { id: CFG.rateReviewers.RAHIM.id, email: lc,
             name: CFG.rateReviewers.RAHIM.name, role: "RATE_REVIEWER", scope: "self" };
  }

  // 2. Finance / AP. Directory first so that once these people are added
  //    upstream, the live record wins over the fallback list below.
  const dirFinance = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "FINANCE");
  if (dirFinance) {
    if (pw !== P.finance) return { error: "That password doesn't match the finance role." };
    return { id: dirFinance.id, email: lc, name: dirFinance.name, role: "FINANCE", scope: "all" };
  }
  const seeded = CFG.financeUsers.find(u => u.email.toLowerCase() === lc);
  if (seeded) {
    if (pw !== P.finance) return { error: "That password doesn't match the finance role." };
    return { id: "fin:" + lc, email: lc, name: seeded.name, role: "FINANCE", scope: "all" };
  }

  // 3. Director of Ops
  const director = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "DIRECTOR");
  if (director) {
    if (pw !== P.director) return { error: "That password doesn't match the director role." };
    return { id: director.id, email: lc, name: director.name, role: "DIRECTOR", scope: "director" };
  }

  // 4. Area Coach / District Manager
  const coach = Object.values(dir.users).find(
    u => emailOf(u) === lc && u.role === "AREA_COACH");
  if (coach) {
    if (pw !== P.coach) return { error: "That password doesn't match the district manager role." };
    return { id: coach.id, email: lc, name: coach.name, role: "AREA_COACH", scope: "stores" };
  }

  // 5. Store manager — matched on the store's own email address.
  const store = dir.stores.find(s => (s.email || "").toLowerCase() === lc);
  if (store) {
    if (pw !== P.manager) return { error: "That password doesn't match the store role." };
    return { id: "store:" + store.id, email: lc, name: store.storeManager || store.name,
             role: "MANAGER", scope: "single", storeId: store.id };
  }

  return { error: "We couldn't find that email in the directory. Check it's the email on file." };
}

// Impersonated sessions use the SAME shape resolveSession returns, so the
// simulated view is exactly what that person would see.
function buildImpersonatedSession(u, dir) {
  if (u.kind === "store") {
    const s = dir.stores.find(x => x.id === u.id);
    if (!s) return null;
    return { id: "store:" + s.id, email: (s.email || "").toLowerCase(),
             name: s.storeManager || s.name, role: "MANAGER",
             scope: "single", storeId: s.id, _sim: true };
  }
  const person = dir.users[u.id];
  if (!person) return null;
  return { id: person.id, email: (person.email || "").toLowerCase(),
           name: person.name, role: person.role,
           scope: person.role === "DIRECTOR" ? "director" : "stores", _sim: true };
}

// Everyone an admin can view as.
function viewAsRoster(dir) {
  const rows = [];
  Object.values(dir.users).forEach(u => {
    rows.push({ kind: "user", id: u.id, primary: u.name,
                secondary: roleLabel(u.role),
                search: (u.name + " " + (u.email || "") + " " + u.role).toLowerCase() });
  });
  CFG.financeUsers.forEach(f => {
    if (Object.values(dir.users).some(u => (u.email || "").toLowerCase() === f.email.toLowerCase())) return;
    rows.push({ kind: "finance", id: "fin:" + f.email.toLowerCase(), primary: f.name,
                secondary: "Finance", search: (f.name + " " + f.email + " finance").toLowerCase() });
  });
  dir.stores.forEach(s => {
    rows.push({ kind: "store", id: s.id,
                primary: s.storeManager || "(no manager on file)",
                secondary: s.name,
                search: (s.name + " " + s.storeNumber + " " + (s.storeManager || "")).toLowerCase() });
  });
  return rows;
}

/* ============================================================
   3. SLA TIMER — business hours only
   Mon-Fri 08:00-17:00. Nights, weekends and configured holidays
   contribute nothing. The clock is NOT paused or reset by
   comments; it stops only when the approver approves or rejects,
   and restarts from zero for the next approver in the chain.
   Colour is always derived from stageEnteredAt, never stored, so
   it cannot go stale in the database.
   ============================================================ */
const BH = CFG.businessHours;

function isBusinessDay(d) {
  if (!BH.days.includes(d.getDay())) return false;
  const iso = d.getFullYear() + "-" +
              String(d.getMonth() + 1).padStart(2, "0") + "-" +
              String(d.getDate()).padStart(2, "0");
  return !(BH.holidays || []).includes(iso);
}

// Minutes of business time between two instants.
function businessMinutesBetween(from, to) {
  if (to <= from) return 0;
  let mins = 0;
  const cur = new Date(from);
  let guard = 0;
  while (cur < to && guard++ < 4000) {
    if (isBusinessDay(cur)) {
      const open  = new Date(cur); open.setHours(BH.startHour, 0, 0, 0);
      const close = new Date(cur); close.setHours(BH.endHour, 0, 0, 0);
      const s = cur > open ? cur : open;
      const e = to < close ? to : close;
      if (e > s) mins += (e - s) / 60000;
    }
    cur.setDate(cur.getDate() + 1);
    cur.setHours(0, 0, 0, 0);
  }
  return mins;
}

// The instant at which `minutes` of business time will have elapsed.
function addBusinessMinutes(from, minutes) {
  let left = minutes;
  const cur = new Date(from);
  let guard = 0;
  while (left > 0 && guard++ < 4000) {
    if (isBusinessDay(cur)) {
      const open  = new Date(cur); open.setHours(BH.startHour, 0, 0, 0);
      const close = new Date(cur); close.setHours(BH.endHour, 0, 0, 0);
      const s = cur > open ? new Date(cur) : open;
      if (s < close) {
        const avail = (close - s) / 60000;
        if (avail >= left) return new Date(s.getTime() + left * 60000);
        left -= avail;
      }
    }
    cur.setDate(cur.getDate() + 1);
    cur.setHours(0, 0, 0, 0);
  }
  return new Date(from + minutes * 60000);
}

// Hours in one full business day, derived from the configured window.
const BIZ_DAY_HOURS = BH.endHour - BH.startHour;
const SLA_HOURS = CFG.slaDays * BIZ_DAY_HOURS;

function slaState(inv, now) {
  if (!inv.stageEnteredAt || inv.status !== "PENDING") return null;
  const usedH = businessMinutesBetween(new Date(inv.stageEnteredAt), new Date(now)) / 60;
  const remainingH = SLA_HOURS - usedH;
  const dueAt = addBusinessMinutes(new Date(inv.stageEnteredAt), SLA_HOURS * 60);
  let level = "ok";
  if (usedH >= SLA_HOURS) level = "late";
  else if (usedH >= SLA_HOURS / 2) level = "warn";
  // Outside working hours the clock is frozen — worth showing so an approver
  // doesn't think the display is broken.
  const paused = !isBusinessDay(new Date(now)) ||
                 new Date(now).getHours() < BH.startHour ||
                 new Date(now).getHours() >= BH.endHour;
  return {
    usedH, remainingH, level, dueAt, paused,
    usedDays: usedH / BIZ_DAY_HOURS,
    remainingDays: remainingH / BIZ_DAY_HOURS
  };
}

// Everything users see is in business days — never hours.
function dayWord(n) { return n === 1 ? "day" : "days"; }

// Human phrase for the SLA window, used in banners and tooltips.
const SLA_PHRASE = CFG.slaDays + " business " + dayWord(CFG.slaDays);

function fmtDueShort(d) {
  return d.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function slaLabel(s) {
  if (!s) return "";
  if (s.level === "late") return "Overdue — was due " + fmtDueShort(s.dueAt);
  return "Approval due by " + fmtDueShort(s.dueAt);
}

function slaTitle(s) {
  if (!s) return "";
  const due = s.dueAt.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  return "Due " + due + " · " + SLA_PHRASE + " (Mon-Fri " + BH.startHour + ":00-" + BH.endHour + ":00)" +
         (s.paused ? " · clock paused outside working hours" : "");
}

/* ============================================================
   4. INVOICE SERVICE — Firestore
   Same method names as the old Supabase service so the UI that
   gets ported later needs no changes.
   ============================================================ */
// Firestore rejects `undefined` anywhere in a document. Strip it before
// every write so one optional field can never sink a submission again.
function cleanForFirestore(obj) {
  return JSON.parse(JSON.stringify(obj));
}

/* ============================================================
   REPORT ROWS — one row per STORE CHAIN, filtered by date range,
   status, vendor, DM, and DO. A row qualifies for the date range
   when ANY of its events (created, any decision, paid) falls on
   or between the selected dates, inclusive.
   ============================================================ */
function decisionFor(chain, role) {
  const h = [...(chain.history || [])].reverse()
    .find(x => x.stage === role && (x.action === "APPROVE" || x.action === "REJECT"));
  const step = (chain.steps || []).find(st => st.role === role);
  return {
    name: h ? h.byName : (step ? step.name : ""),
    action: h ? (h.action === "APPROVE" ? "Approved" : "Rejected") : (step ? "Pending" : ""),
    date: h ? new Date(h.ts).toLocaleString() : "",
    note: h ? (h.note || "") : ""
  };
}

function effectiveChainStatus(inv, chain) {
  if (inv.status === "PAID" && chain.status === "APPROVED") return "PAID";
  return chain.status;
}

function buildReportRows(invoices, f) {
  // f: { startMs, endMs, statuses:Set, vendor, dmId, doId }
  const rows = [];
  invoices.forEach(inv => {
    getChains(inv).forEach(chain => {
      // Date: any event in range.
      const events = [inv.createdAt, inv.paidAt,
                      ...(chain.history || []).map(h => h.ts)].filter(Boolean);
      if (f.startMs != null && f.endMs != null &&
          !events.some(t => t >= f.startMs && t <= f.endMs)) return;

      const status = effectiveChainStatus(inv, chain);
      if (f.statuses && f.statuses.size && !f.statuses.has(status)) return;

      if (f.vendor && (inv.vendor || "") !== f.vendor) return;

      const dmStep = (chain.steps || []).find(st => st.role === "AREA_COACH");
      const doStep = (chain.steps || []).find(st => st.role === "DIRECTOR");
      if (f.dmId && !(dmStep && (dmStep.userIds || []).includes(f.dmId))) return;
      if (f.doId && !(doStep && (doStep.userIds || []).includes(f.doId))) return;

      const dm = decisionFor(chain, "AREA_COACH");
      const rc = decisionFor(chain, "RATE_REVIEW");
      const dO = decisionFor(chain, "DIRECTOR");
      const vp = decisionFor(chain, "VP");

      rows.push({
        "Invoice #": inv.invoiceNumber || "",
        "Vendor": inv.vendor || "",
        "Amount": Number(inv.amount) || 0,
        "Store": chain.storeName || "",
        "Store #": chain.storeNumber || "",
        "Entity": chain.entity || "",
        "Division": chain.division || "",
        "DM": dm.name, "DM Decision": dmStep ? dm.action : "N/A",
        "DM Decision Date": dm.date,
        "Rate Approver": rc.name,
        "Rate Decision": (chain.steps || []).some(st => st.role === "RATE_REVIEW") ? rc.action : "N/A",
        "Rate Decision Date": rc.date,
        "DO": dO.name, "DO Decision": doStep ? dO.action : "N/A",
        "DO Decision Date": dO.date,
        "VP Decision": (chain.steps || []).some(st => st.role === "VP") ? vp.action : "N/A",
        "VP Decision Date": vp.date,
        "Rejection Comment": [dm, rc, dO, vp].map(x => x.note).filter(Boolean).join(" | "),
        "Chain Status": chain.status,
        "Invoice Status": inv.status,
        "Created By": inv.createdByName || inv.createdBy || "",
        "Created Date": inv.createdAt ? new Date(inv.createdAt).toLocaleString() : "",
        "Paid Date": inv.paidAt ? new Date(inv.paidAt).toLocaleString() : ""
      });
    });
  });
  return rows;
}

/* ============================================================
   FIRESTORE SELF-TEST
   The SDK retries "backend unavailable" silently forever, which
   makes a missing database look like a hung save. The REST API
   answers honestly: 404 NOT_FOUND = the database was never
   created; 403 = rules are blocking; 200 = healthy.
   ============================================================ */
async function probeFirestore() {
  const pid = CFG.firebase.projectId;
  const url = "https://firestore.googleapis.com/v1/projects/" + pid +
              "/databases/(default)/documents/invoices?pageSize=1&key=" + CFG.firebase.apiKey;
  try {
    const res = await fetch(url);
    const body = await res.json().catch(() => ({}));
    const status = body && body.error && body.error.status;
    if (res.ok) return { ok: true, verdict: "healthy",
      message: "Firestore is reachable and readable." };
    if (status === "NOT_FOUND" || res.status === 404) return { ok: false, verdict: "no-database",
      message: "No Firestore database exists for project \"" + pid + "\". " +
        "This project was auto-created for an API key and never got a database. " +
        "Fix: open console.firebase.google.com → select this project → Build → " +
        "Firestore Database → Create database. Until then, every save will hang." };
    if (status === "PERMISSION_DENIED" || res.status === 403) return { ok: false, verdict: "rules",
      message: "The database exists but security rules are blocking access. " +
        "Fix: Firebase console → Firestore Database → Rules — for testing you can " +
        "allow read/write, then lock down before go-live." };
    return { ok: false, verdict: "other",
      message: "Firestore responded with an unexpected error (" + res.status + "): " +
        ((body.error && body.error.message) || "unknown") };
  } catch (e) {
    return { ok: false, verdict: "network",
      message: "Couldn't reach firestore.googleapis.com at all — a VPN, proxy, " +
        "or ad-blocker is blocking it. (" + (e.message || "network error") + ")" };
  }
}

const VENDOR_RULES_DOC = "_config_vendorRules";

const vendorRulesService = {
  async save(rules, user) {
    await window.FS.setDoc(window.FS.doc(window.FS.db, "invoices", VENDOR_RULES_DOC), {
      _config: true,
      rules: rules || {},
      // createdAt required: the main subscription orders by createdAt and

      createdAt: 0,
      updatedAt: Date.now(),
      updatedBy: user ? user.name : ""
    });
  }
};

const invoiceService = {
  _col() { return window.FS.collection(window.FS.db, "invoices"); },

  subscribe(cb, onErr) {
    const q = window.FS.query(this._col(), window.FS.orderBy("createdAt", "desc"));
    return window.FS.onSnapshot(q,
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err  => onErr && onErr(err));
  },

  async create(inv) {
    // If the write can't reach Firestore it retries silently forever; surface
    // that as an error instead of a button stuck on "Saving…".
    const write = window.FS.addDoc(this._col(), cleanForFirestore(inv));
    const timeout = new Promise((_, rej) => setTimeout(() =>
      rej(new Error("The save didn't reach the database within 20 seconds. " +
                    "Check your connection (VPNs, proxies, and ad-blockers can block Firestore) and try again.")), 20000));
    const ref = await Promise.race([write, timeout]);
    return ref.id;
  },

  async update(id, patch) {
    await window.FS.updateDoc(window.FS.doc(window.FS.db, "invoices", id),
      cleanForFirestore(patch));
  },

  async remove(id) {
    await window.FS.deleteDoc(window.FS.doc(window.FS.db, "invoices", id));
  }
};

/* ============================================================
   4b. COMMENTS — invoices/{id}/comments subcollection
   Kept out of the invoice document so that a long thread cannot
   push the doc toward Firestore's 1MB ceiling, and so two people
   posting at once don't overwrite each other.
   Commenting never touches stageEnteredAt: the SLA clock is not
   affected by discussion, only by Approve/Reject.
   ============================================================ */
const commentService = {
  _col(invoiceId) {
    return window.FS.collection(window.FS.db, "invoices", invoiceId, "comments");
  },

  subscribe(invoiceId, cb, onErr) {
    const q = window.FS.query(this._col(invoiceId), window.FS.orderBy("ts", "asc"));
    return window.FS.onSnapshot(q,
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err  => onErr && onErr(err));
  },

  async add(invoiceId, author, text, inv, meta) {
    const ts = Date.now();
    await window.FS.addDoc(this._col(invoiceId), {
      userId: author.id,
      userName: author.name,
      userRole: author.role,
      text: String(text).trim(),
      action: (meta && meta.action) || null,       // "APPROVE" | "REJECT" | null
      storeName: (meta && meta.storeName) || null, // which chain the action was on
      ts
    });
    // Denormalize onto the invoice doc so notification counts are computable
    // from a single document read (the repair app reads these over REST).
    const log = [...((inv && inv.commentLog) || []), { ts, by: author.id }];
    await invoiceService.update(invoiceId, { commentLog: log, lastCommentAt: ts });
  },

  async markRead(invoiceId, userId) {
    await window.FS.updateDoc(window.FS.doc(window.FS.db, "invoices", invoiceId),
      { ["commentReads." + userId]: Date.now() });
  }
};

   ============================================================ */
// The Filestack script is a separate CDN request, so it may not have parsed by
// the time this component first renders. Retry briefly instead of permanently
// deciding uploads are unavailable on the first paint.
function useFilestack() {
  const ref = useRef(null);
  const [, bump] = useState(0);

  useEffect(() => {
    if (ref.current) return;
    let tries = 0;
    const t = setInterval(() => {
      if (window.filestack && CFG.filestackApiKey &&
          !CFG.filestackApiKey.startsWith("PASTE_")) {
        try {
          ref.current = window.filestack.init(CFG.filestackApiKey);
          bump(n => n + 1);
        } catch (e) { /* leave null; the picker reports it */ }
        clearInterval(t);
      } else if (++tries > 40) {          // ~10s
        clearInterval(t);
        bump(n => n + 1);
      }
    }, 250);
    return () => clearInterval(t);
  }, []);

  return ref.current;
}

function FinanceDashboard({ invoices, stores, users, filters, setFilters, onStatusNav }) {
  const stats = useMemo(() => {
    const counts = { PENDING: 0, APPROVED: 0, REJECTED: 0, PAID: 0 };

    invoices.forEach(i => {
      if (counts[i.status] !== undefined) counts[i.status]++;

function LateBanner({ invoices, now }) {
  // Count individual STORE CHAINS past the deadline, since each chain has its
  // own clock. One 4-store invoice can contribute several overdue chains.
  const late = [];
  invoices.forEach(i => {
    getChains(i).forEach(c => {
      if (c.status !== "PENDING") return;
      const s = slaState(c, now);
      if (s && s.level === "late") late.push({ inv: i, chain: c });
    });
  });
  if (!late.length) return null;
  return (
    <div className="mb-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3">
      <div className="flex items-center justify-between gap-4">
        <div>
          <p className="font-semibold text-red-800">
            {late.length} store approval{late.length > 1 ? "s" : ""} past the {SLA_PHRASE} deadline
          </p>
          <p className="text-sm text-red-700">
            {late.slice(0, 3).map(x =>
              x.inv.vendor + " → " + x.chain.storeName).join(" · ")}
            {late.length > 3 ? " and " + (late.length - 3) + " more" : ""}
          </p>
        </div>
      </div>
    </div>
  );
}

function ViewAsModal({ dir, onPick, onClose }) {

    const t = q.toLowerCase().trim();
    return t ? roster.filter(r => r.search.includes(t)) : roster;

  return (
    <div className="fixed inset-0 z-30 flex items-start justify-center bg-black/40 p-4 pt-16"
         onClick={onClose}>

                className="block w-full rounded-lg px-3 py-2 text-left hover:bg-slate-50">

                {r.secondary && (

// Searchable multi-select store picker. Matches on store number, name,
// entity, division, and manager, so "23086", "atlanta", or "al's" all work.
// Searchable multi-select store picker. Matches on store number, name,
// entity, division, and manager, so "23086", "atlanta", or "al's" all work.
// Selecting clears the typed text and CLOSES the menu — single store is the
// common case. Focus the box again to add more stores.
function StorePicker({ stores, selectedIds, onChange }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const boxRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    function onDoc(e) {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  const shown = useMemo(() => {
    const t = q.trim().toLowerCase();
    const base = t ? stores.filter(s =>
      (s.name || "").toLowerCase().includes(t) ||
      (s.storeNumber || "").toLowerCase().includes(t) ||
      (s.storeNumber || "").replace(/^#0*/, "").toLowerCase().includes(t.replace(/^#0*/, "")) ||
      (s.entity || "").toLowerCase().includes(t) ||
      (s.division || "").toLowerCase().includes(t) ||
      (s.storeManager || "").toLowerCase().includes(t)) : stores;
    return base;
  }, [q, stores]);

  const selected = stores.filter(s => selectedIds.includes(s.id));

  function toggle(id) {
    onChange(selectedIds.includes(id)
      ? selectedIds.filter(x => x !== id)
      : [...selectedIds, id]);
    setQ("");          // no leftover typed text
    setOpen(false);    // single store is the usual case — get out of the way.
                       // Click or type again to add another.
  }

  function onKey(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      // Enter adds the first match that isn't already selected.
      const first = shown.find(s => !selectedIds.includes(s.id));
      if (first) toggle(first.id);
    } else if (e.key === "Escape") {
      setOpen(false);
    }
  }

  return (
    <div ref={boxRef} className="relative">
      {selected.length > 0 && (
        <div className="mb-2 flex flex-wrap gap-1.5">
          {selected.map(s => (
            <span key={s.id}
              className="inline-flex items-center gap-1.5 rounded-full bg-slate-900 px-2.5 py-1 text-xs text-white">
              <span>{s.storeNumber} {s.name.replace(/#\S+\s*/, "")}</span>
              <button type="button" onClick={() => toggle(s.id)}
                className="text-slate-300 hover:text-white" title="Remove">✕</button>
            </span>
          ))}
        </div>
      )}

      <input ref={inputRef} value={q}
        onFocus={() => setOpen(true)}
        onChange={e => { setQ(e.target.value); setOpen(true); }}
        onKeyDown={onKey}
        placeholder="Type store # or name, press Enter to add"
        className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />

      {open && (
        <div className="absolute z-10 mt-1 max-h-64 w-full overflow-y-auto rounded-lg border
                        border-slate-200 bg-white shadow-lg">
          {shown.length === 0 && (
            <p className="px-3 py-4 text-center text-sm text-slate-400">No stores match.</p>
          )}
          {shown.map((s, si) => {
            const on = selectedIds.includes(s.id);
            const isFirst = !on && shown.find(x => !selectedIds.includes(x.id)) === s;
            return (
              <button type="button" key={s.id} onClick={() => toggle(s.id)}
                className={"flex w-full items-center gap-2 px-3 py-1.5 text-left text-sm hover:bg-slate-50 " +
                           (on ? "bg-sky-50 text-sky-900" : "text-slate-800") +
                           (isFirst && q ? " bg-slate-50" : "")}>
                <span className="w-4 shrink-0 text-center text-sky-600">{on ? "✓" : ""}</span>
                <span className="shrink-0 font-medium">{s.storeNumber}</span>
                <span className="min-w-0 truncate">{s.name.replace(/#\S+\s*/, "")}</span>
                <span className="min-w-0 flex-1 truncate text-right text-xs text-slate-400">
                  {s.entity || s.division || ""}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function NewInvoice({ stores, users, currentUser, knownVendors, vendorRules, onDone }) {
  const fs = useFilestack();
  const [storeIds, setStoreIds] = useState([]);
  const [vendor, setVendor]   = useState("");
  const [amount, setAmount]   = useState("");
  const [invoiceNumber, setInvoiceNumber] = useState("");
  const [file, setFile]       = useState(null);
  const [busy, setBusy]       = useState(false);
  const [uploading, setUploading] = useState(false);
  const [err, setErr]         = useState("");

  const vendorOptions = useMemo(() => {
    let local = [];
    try { local = JSON.parse(localStorage.getItem("ap_vendor_history") || "[]"); } catch (e) {}
    const seen = new Map();
    [...(knownVendors || []), ...local].forEach(v => {
      const t = (v || "").trim();
      if (t && !seen.has(t.toLowerCase())) seen.set(t.toLowerCase(), t);
    });
    return [...seen.values()].sort((a, b) => a.localeCompare(b));
  }, [knownVendors]);

  function rememberVendor(v) {
    try {
      const t = (v || "").trim();
      if (!t) return;
      let local = JSON.parse(localStorage.getItem("ap_vendor_history") || "[]");
      local = [t, ...local.filter(x => x.toLowerCase() !== t.toLowerCase())].slice(0, 100);
      localStorage.setItem("ap_vendor_history", JSON.stringify(local));
    } catch (e) { /* storage full or blocked — autofill just won't learn */ }
  }

  const selStores = stores.filter(s => storeIds.includes(s.id));
  const amt   = parseFloat(amount) || 0;

  // Second approver: the vendor rule decides, and finance can override it for
  // THIS invoice from the path rail. Changing the vendor resets the override
  // so a stale choice never sticks to the wrong vendor.
  const [rateOverride, setRateOverride] = useState(null);   // null = follow rule
  useEffect(() => { setRateOverride(null); }, [vendor]);
  const rateRule = rateOverride || vendorRuleFor(vendor, { rules: vendorRules });

  const previewChains = selStores.length
    ? buildChains(selStores, amt, users, Date.now(), rateRule) : [];

  function pickFile() {
    setErr("");
    if (!fs) {
      setErr("Upload isn't available — the Filestack script didn't load. Check the network or the API key.");
      return;
    }
    setUploading(true);
    fs.picker({
      accept: ["application/pdf", "image/*"],
      maxFiles: 1,
      fromSources: ["local_file_system", "googledrive", "dropbox", "onedrive"],
      // Files land under the first store so invoices stay traceable in Filestack.
      storeTo: { path: "/invoices/" +
        (selStores.length ? (selStores[0].storeNumber || selStores[0].id) : "unfiled") + "/" },
      onUploadDone: r => {
        setUploading(false);
        const f = r.filesUploaded && r.filesUploaded[0];
        if (f) setFile({ url: f.url, name: f.filename, handle: f.handle, size: f.size });
        else setErr("Nothing was uploaded. Try again.");
      },
      onFileUploadFailed: (f, e) => {
        setUploading(false);
        setErr("Upload failed: " + ((e && e.message) || "unknown error"));
      },
      onClose: () => setUploading(false)
    }).open();
  }

  async function submit() {
    setErr("");
    if (!selStores.length) return setErr("Pick at least one store.");
    if (!vendor.trim())    return setErr("Enter a vendor.");
    if (!(amt > 0))        return setErr("Enter an amount.");

    const now = Date.now();
    const chains = buildChains(selStores, amt, users, now, rateRule);
    if (chains.every(c => !c.steps.length))
      return setErr("No approvers found for these stores — check the directory.");

    setBusy(true);
    try {
      await invoiceService.create({
        vendor: vendor.trim(),
        amount: amt,
        invoiceNumber: invoiceNumber.trim(),
        storeIds: selStores.map(s => s.id),
        storeNames: selStores.map(s => s.name),
        entities: [...new Set(selStores.map(s => s.entity).filter(Boolean))],
        storeId: selStores[0].id,
        storeName: selStores.map(s => s.name).join(" + "),
        division: [...new Set(selStores.map(s => s.division))].join(" / "),
        // One independent chain per store.
        chains,
        status: deriveStatus(chains),
        fileUrl: file ? file.url : null,
        fileName: file ? file.name : null,
        createdAt: now,
        updatedAt: now,
        createdBy: currentUser.id,
        createdByName: currentUser.name
      });
      rememberVendor(vendor);
      setVendor(""); setAmount(""); setInvoiceNumber(""); setFile(null); setStoreIds([]);
      onDone && onDone();
    } catch (e) {
      setErr(e.message || "Could not save.");
    } finally {
      setBusy(false);
    }
  }

  // Deadline for the whole path: step 1 gets the SLA window from submission,
  // step 2 gets it from step 1's deadline, and so on. Recomputed live so the
  // dates shown are what the approvers will actually face.
  function pathWithDeadlines(steps) {
    let from = new Date();
    return steps.map(s => {
      const dueAt = addBusinessMinutes(from, SLA_HOURS * 60);
      from = dueAt;
      return { ...s, dueAt };
    });
  }
  const fmtDue = d => d.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

  return (
    <div className="grid gap-5 xl:grid-cols-[1fr_minmax(460px,620px)_1fr]">

      {/* LEFT RAIL — the approval path, with the SLA window and the projected
          date/time between each approver. */}
      <div className="order-2 xl:order-1 xl:col-start-1 xl:row-start-1">
        <div className="rounded-xl border bg-white p-5 shadow-sm xl:sticky xl:top-4">
          <h3 className="text-sm font-semibold uppercase tracking-wide text-slate-500">
            Approval path
          </h3>
          <div className="mt-3 rounded-lg bg-slate-50 p-3">
            <p className="text-xs font-medium uppercase tracking-wide text-slate-500">
              Second approver (after DM)
            </p>
            <div className="mt-1.5 flex flex-wrap gap-1.5">
              {[["NONE", "None"], ["IT", "IT Support"], ["RAHIM", "Rahim"]].map(([v, lbl]) => (
                <button key={v} type="button" onClick={() => setRateOverride(v)}
                  className={"rounded-full border px-2.5 py-1 text-xs font-medium " +
                    (rateRule === v
                      ? "border-slate-900 bg-slate-900 text-white"
                      : "border-slate-300 bg-white text-slate-600 hover:bg-slate-100")}>
                  {lbl}
                </button>
              ))}
            </div>
            <p className="mt-1.5 text-xs text-slate-400">
              {rateOverride
                ? "Overridden for this invoice only."
                : vendor.trim()
                  ? "From the vendor rule for \u201C" + vendor.trim() + "\u201D. Tap to override."
                  : "Default until a vendor is entered. Vendor rules live in Settings."}
            </p>
          </div>

          {selStores.length === 0 ? (
            <p className="mt-3 text-sm text-slate-400">
              Pick a store and the route will map out here — who signs, in what
              order, and by when.
            </p>
          ) : (
            <div className="mt-3 space-y-5">
              {previewChains.map((c, ci) => (
                <div key={ci}>
                  <p className="text-base font-semibold text-slate-900">{c.storeName}</p>
                  <p className="text-xs text-slate-500">
                    {[c.division, c.entity].filter(Boolean).join(" · ") || "—"}
                  </p>
                  {c.steps.length ? (
                    <ol className="mt-2">
                      {pathWithDeadlines(c.steps).map((s, si) => (
                        <li key={si}>
                          <div className="flex items-center gap-2">
                            <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full
                                             bg-slate-900 text-sm font-semibold text-white">
                              {si + 1}
                            </span>
                            <div>
                              <p className="text-base font-medium text-slate-900">{s.name}</p>
                              <p className="text-sm text-slate-500">{s.label}</p>
                              {s.note && <p className="text-xs italic text-slate-400">"{s.note}"</p>}
                            </div>
                          </div>
                          <div className="ml-3.5 border-l-2 border-slate-200 py-1.5 pl-5">
                            <p className="text-sm text-slate-600">
                              {SLA_PHRASE} — by{" "}
                              <span className="font-medium text-slate-800">{fmtDue(s.dueAt)}</span>
                            </p>
                          </div>
                        </li>
                      ))}
                      <li className="flex items-center gap-2">
                        <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full
                                         bg-emerald-600 text-sm text-white">✓</span>
                        <p className="text-sm font-medium text-emerald-700">Ready for payment</p>
                      </li>
                    </ol>
                  ) : (
                    <p className="mt-2 text-sm text-red-700">
                      No approvers on file — this chain cannot route.
                    </p>
                  )}
                </div>
              ))}
              {previewChains.length > 1 && (
                <p className="text-xs text-slate-400">
                  Each store approves independently. If some approve and others
                  reject, payment is processed for the approved stores only.
                </p>
              )}
            </div>
          )}
        </div>
      </div>

      {/* CENTER — the form itself. */}
      <div className="order-1 rounded-xl border bg-white p-5 shadow-sm xl:order-2 xl:col-start-2 xl:row-start-1">
        <h2 className="text-sm font-semibold text-slate-900">New invoice</h2>

        <div className="mt-4 grid gap-3 sm:grid-cols-2">
          <label className="text-sm sm:col-span-2">
            <span className="text-slate-600">Store(s)</span>
            <div className="mt-1">
              <StorePicker stores={stores} selectedIds={storeIds} onChange={setStoreIds} />
            </div>
          </label>

          <label className="text-sm">
            <span className="text-slate-600">Vendor</span>
            <input value={vendor} onChange={e => setVendor(e.target.value)}
              list="vendor-suggestions" autoComplete="off"
              placeholder="Start typing — past vendors suggest themselves"
              className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
            <datalist id="vendor-suggestions">
              {vendorOptions.map(v => <option key={v} value={v} />)}
            </datalist>
          </label>

          <label className="text-sm">
            <span className="text-slate-600">Amount (USD)</span>
            <input value={amount} onChange={e => setAmount(e.target.value)}
              inputMode="decimal" placeholder="0.00"
              className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
          </label>

          <label className="text-sm">
            <span className="text-slate-600">Invoice # <span className="text-slate-400">(optional)</span></span>
            <input value={invoiceNumber} onChange={e => setInvoiceNumber(e.target.value)}
              className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
          </label>
        </div>

        <div className="mt-3 flex flex-wrap items-center gap-3">
          <button type="button" onClick={pickFile} disabled={uploading || !fs}
            className="rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50 disabled:opacity-50">
            {uploading ? "Uploading…" : file ? "Replace file" : "Attach invoice PDF"}
          </button>

          {file && (
            <span className="flex min-w-0 items-center gap-2 rounded-lg bg-emerald-50 px-3 py-1.5">
              <span className="truncate text-sm text-emerald-800">{file.name}</span>
              {file.size ? (
                <span className="shrink-0 text-xs text-emerald-600">
                  {(file.size / 1024).toFixed(0)} KB
                </span>
              ) : null}
              <button type="button" onClick={() => setFile(null)}
                className="shrink-0 text-emerald-700 hover:text-emerald-900" title="Remove">✕</button>
            </span>
          )}

          {!fs && !uploading && (
            <span className="text-xs text-slate-400">Upload unavailable</span>
          )}
        </div>

        {err && <p className="mt-3 text-sm text-red-700">{err}</p>}

        <button onClick={submit} disabled={busy}
          className="mt-4 rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white disabled:opacity-50">
          {busy ? "Saving…" : "Send for approval"}
        </button>
      </div>

      {/* RIGHT RAIL — the document, big. Portrait-friendly height. */}
      <div className="order-3 xl:col-start-3 xl:row-start-1">
        <div className="xl:sticky xl:top-4">
          {uploading ? (
            <div className="pdf-frame-tall flex items-center justify-center rounded-xl border
                            border-slate-200 bg-slate-50">
              <p className="text-sm text-slate-500">Uploading…</p>
            </div>
          ) : file ? (
            <div className="overflow-hidden rounded-xl border border-slate-200 shadow-sm">
              {/\.(png|jpe?g|gif|webp)(\?|$)/i.test(file.url) ? (
                <div className="pdf-frame-tall overflow-y-auto bg-slate-100">
                  <img src={file.url} alt={file.name} className="w-full" />
                </div>
              ) : (
                <iframe src={file.url} title="Invoice preview"
                        className="pdf-frame-tall bg-slate-100" />
              )}
              <div className="flex items-center justify-between border-t bg-slate-50 px-3 py-1.5">
                <span className="truncate text-xs text-slate-500">{file.name}</span>
                <a href={file.url} target="_blank" rel="noopener noreferrer"
                   className="shrink-0 text-xs font-medium text-sky-700 hover:underline">
                  Open full size ↗
                </a>
              </div>
            </div>
          ) : (
            <div className="pdf-frame-tall flex flex-col items-center justify-center gap-2
                            rounded-xl border-2 border-dashed border-slate-200 bg-slate-50/50">
              <p className="text-sm text-slate-400">No document yet</p>
              <p className="px-6 text-center text-xs text-slate-400">
                Attach the invoice PDF and it will preview here, full height.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function CommentThread({ invoiceId, inv, currentUser, canPost }) {
  const [items, setItems] = useState(null);
  const [text, setText]   = useState("");
  const [busy, setBusy]   = useState(false);
  const [err, setErr]     = useState("");

  useEffect(() => {
    if (!window.FS) return;
    const unsub = commentService.subscribe(invoiceId, setItems,
      e => setErr(e.message || "Couldn't load comments."));
    return () => unsub && unsub();
  }, [invoiceId]);

  async function post() {
    const t = text.trim();
    if (!t) return;
    setBusy(true); setErr("");
    try {
      await commentService.add(invoiceId, currentUser, t, inv);
      setText("");
    } catch (e) {
      setErr(e.message || "Couldn't post.");
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="mt-3 border-t pt-3">
      <div className="flex items-center justify-between">
        <p className="text-xs font-medium uppercase tracking-wide text-slate-500">
          Conversation{items && items.length ? " (" + items.length + ")" : ""}
        </p>
        {inv && !currentUser._sim && unreadCommentsFor(currentUser.id, inv) > 0 && (
          <button onClick={() => commentService.markRead(invoiceId, currentUser.id)}
            className="rounded-lg border border-sky-300 bg-sky-50 px-2.5 py-1 text-xs font-medium text-sky-800 hover:bg-sky-100">
            ✓ Mark {unreadCommentsFor(currentUser.id, inv)} as read
          </button>
        )}
      </div>

      {items === null && <p className="mt-2 text-sm text-slate-400">Loading…</p>}
      {items && items.length === 0 && (
        <p className="mt-2 text-sm text-slate-400">No comments yet.</p>
      )}

      {items && items.length > 0 && (
        <ul className="mt-2 space-y-2">
          {items.map(c => {
            const me = c.userId === currentUser.id;
            return (
              <li key={c.id}
                  className={"rounded-lg px-3 py-2 " + (me ? "bg-sky-50" : "bg-slate-50")}>
                <div className="flex flex-wrap items-baseline gap-2">
                  <span className="text-sm font-medium text-slate-800">{c.userName}</span>
                  {c.action && (
                    <span className={"rounded-full px-2 py-0.5 text-[10px] font-bold tracking-wide " +
                      (c.action === "REJECT" ? "bg-red-100 text-red-700" : "bg-emerald-100 text-emerald-700")}>
                      {c.action === "REJECT" ? "REJECTED" : "APPROVED"}{c.storeName ? " · " + c.storeName : ""}
                    </span>
                  )}
                  <span className="text-xs text-slate-400">
                    {roleLabel(c.userRole)} · {new Date(c.ts).toLocaleString()}
                  </span>
                </div>
                <p className="mt-0.5 whitespace-pre-wrap text-sm text-slate-700">{c.text}</p>
              </li>
            );
          })}
        </ul>
      )}

      {err && <p className="mt-2 text-sm text-red-700">{err}</p>}

      {canPost ? (
        <div className="mt-2 flex gap-2">
          <input value={text} onChange={e => setText(e.target.value)}
                 onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); post(); } }}
                 placeholder="Ask a question or add context…"
                 className="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm" />
          <button onClick={post} disabled={busy || !text.trim()}
            className="rounded-lg bg-slate-900 px-3 py-2 text-sm font-medium text-white disabled:opacity-40">
            {busy ? "…" : "Post"}
          </button>
        </div>
      ) : (
        <p className="mt-2 text-xs text-slate-400">
          Return to your own account to post.
        </p>
      )}

      <p className="mt-2 text-xs text-slate-400">
        Comments don't pause the approval clock.
      </p>
    </div>
  );
}

function ChainCard({ inv, chain, chainIdx, currentUser, now, onAct, canFinance }) {
  const [note, setNote] = useState("");
  const [noteErr, setNoteErr] = useState("");

  const MIN_REJECT = 25;
  function tryReject() {
    const t = note.trim();
    if (!t) { setNoteErr("A comment is required to reject."); return; }
    if (t.length < MIN_REJECT) {
      setNoteErr("Rejection comment is too short — at least " + MIN_REJECT +
                 " characters (" + t.length + "/" + MIN_REJECT + ").");
      return;
    }
    setNoteErr("");
    onAct(inv, chainIdx, "REJECT", t);
    setNote("");
  }
  const sla  = chain.status === "PENDING" ? slaState(chain, now) : null;
  const mine = canActOnChain(currentUser, chain) && !currentUser._sim;
  const step = chainCurrentStep(chain);

  const badge =
    chain.status === "APPROVED" ? <Pill tone="ok">Approved</Pill> :
    chain.status === "REJECTED" ? <Pill tone="late">Rejected</Pill> :
    sla ? <span title={slaTitle(sla)}><Pill tone={sla.level} pulse={sla.level === "late"}>{slaLabel(sla)}{sla.paused ? " ⏸" : ""}</Pill></span> : null;

  return (
    <div className={"rounded-lg border px-3 py-2 " +
      (chain.status === "APPROVED" ? "border-emerald-200 bg-emerald-50/40" :
       chain.status === "REJECTED" ? "border-red-200 bg-red-50/40" :
       "border-slate-200 bg-white")}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div className="min-w-0">
          <p className="truncate text-sm font-medium text-slate-900">{chain.storeName}</p>
          <p className="truncate text-xs text-slate-500">
            {[chain.division, chain.entity].filter(Boolean).join(" · ") || "—"}
          </p>
        </div>
        {badge}
      </div>

      {chain.status === "PENDING" && step && (
        <p className="mt-1 text-xs text-slate-600">
          Waiting on <span className="font-medium">{step.label}</span> — {step.name}
          {step.note && <span className="text-slate-400"> · "{step.note}"</span>}
        </p>
      )}

      {/* Step trail for this chain */}
      <div className="mt-1.5 flex flex-wrap gap-x-3 gap-y-0.5 text-xs">
        {(chain.steps || []).map((s, si) => {
          const done = (chain.history || []).some(h => h.stage === s.role && h.action === "APPROVE");
          const rejectedHere = (chain.history || []).some(h => h.stage === s.role && h.action === "REJECT");
          const cur = chain.currentStage === s.role && chain.status === "PENDING";
          return (
            <span key={si}
              className={rejectedHere ? "text-red-600" : done ? "text-emerald-600" :
                         cur ? "font-medium text-slate-800" : "text-slate-400"}>
              {rejectedHere ? "✗" : done ? "✓" : cur ? "→" : "•"} {s.label}
            </span>
          );
        })}
      </div>

      {(chain.history || []).length > 0 && (
        <ul className="mt-1.5 space-y-0.5">
          {chain.history.map((h, hi) => (
            <li key={hi} className="text-xs text-slate-500">
              <span className="font-medium text-slate-600">{h.byName}</span>{" "}
              {h.action === "APPROVE" ? "approved" : h.action === "REJECT" ? "rejected" :
               h.action.toLowerCase()}{" "}
              · {new Date(h.ts).toLocaleString()}
            </li>
          ))}
        </ul>
      )}

      {mine && (
        <div className="mt-2 border-t border-slate-200 pt-2">
          <input value={note} onChange={e => { setNote(e.target.value); if (noteErr) setNoteErr(""); }}
            placeholder="Add to the conversation — optional to approve, required to reject (25+ chars)"
            className={"w-full rounded-lg border px-3 py-1.5 text-sm " +
                       (noteErr ? "border-red-400 bg-red-50" : "border-slate-300")} />
          {noteErr && <p className="mt-1 text-xs font-medium text-red-700">{noteErr}</p>}
          <div className="mt-1.5 flex flex-wrap gap-2">
            <button onClick={() => { onAct(inv, chainIdx, "APPROVE", note.trim()); setNote(""); setNoteErr(""); }}
              className="rounded-lg bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-700">
              Approve
            </button>
            <button onClick={tryReject}
              className="rounded-lg bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-700">
              Reject
            </button>
          </div>
        </div>
      )}

    </div>
  );
}

function InvoiceRow({ inv, users, currentUser, now, onAct, onMarkPaid, onDelete, canFinance, compact }) {
  const [open, setOpen] = useState(false);
  const chains = getChains(inv);
  const mineAny = canUserAct(currentUser, inv) && !currentUser._sim;

  const approved = chains.filter(c => c.status === "APPROVED").length;
  const rejected = chains.filter(c => c.status === "REJECTED").length;
  const resolved = chains.every(c => c.status === "APPROVED" || c.status === "REJECTED");

  // Most urgent SLA across pending chains for the card-level pill.
  const worst = chains
    .filter(c => c.status === "PENDING")
    .map(c => slaState(c, now)).filter(Boolean)
    .sort((a, b) => a.remainingH - b.remainingH)[0] || null;

  const showChains = open || (mineAny && !compact);   // auto-expand when it is your turn, unless the list is long

  return (
    <div className="rounded-xl border bg-white p-4 shadow-sm">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="flex flex-wrap items-center gap-2">
            <p className="font-medium text-slate-900">{inv.vendor}</p>
            <span className="text-sm text-slate-500">
              ${Number(inv.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}
            </span>
            {inv.status === "PENDING" && worst && (
              <span title={slaTitle(worst)}>
                <Pill tone={worst.level} pulse={worst.level === "late"}>
                  {slaLabel(worst)}{worst.paused ? " ⏸" : ""}
                </Pill>
              </span>
            )}
            {inv.status === "PAID" && <Pill tone="ok">Paid</Pill>}
            {inv.status === "APPROVED" && (
              <Pill tone="ok">{approved} of {chains.length} approved</Pill>
            )}
            {inv.status === "REJECTED" && <Pill tone="late">All chains rejected</Pill>}
            {!currentUser._sim && unreadCommentsFor(currentUser.id, inv) > 0 && (
              <span className="rounded-full border border-sky-300 bg-sky-50 px-2 py-0.5 text-xs font-medium text-sky-800">
                💬 {unreadCommentsFor(currentUser.id, inv)} new
              </span>
            )}
            {chains.length > 1 && inv.status === "PENDING" && (approved > 0 || rejected > 0) && (
              <span className="text-xs text-slate-500">
                {approved} approved · {rejected} rejected · {chains.length - approved - rejected} pending
              </span>
            )}
          </div>
          <p className="mt-1 truncate text-sm text-slate-500">
            {chains.length} store{chains.length > 1 ? "s" : ""}
            {inv.invoiceNumber ? " · #" + inv.invoiceNumber : ""}
            {inv.createdByName ? " · by " + inv.createdByName : ""}
          </p>
        </div>

        <div className="flex items-center gap-2">
          {inv.fileUrl && (
            <a href={inv.fileUrl} target="_blank" rel="noopener noreferrer"
               className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
              View PDF
            </a>
          )}
          <button onClick={() => setOpen(o => !o)}
            className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
            {showChains ? "Hide" : compact && mineAny ? "Expand to review" : "Details"}
          </button>
          {canFinance && (
            <button onClick={() => onDelete(inv)}
              title="Delete this invoice"
              className="rounded-lg border border-red-200 px-3 py-1.5 text-sm text-red-600 hover:bg-red-50">
              Delete
            </button>
          )}
        </div>
      </div>

      {/* When expanded: approval path on the LEFT, document preview on the
          RIGHT, side by side — approvers read the invoice while they sign. */}
      {showChains && (
        <div className={"mt-3 grid gap-4 " + (inv.fileUrl ? "lg:grid-cols-2" : "")}>
          <div className="space-y-2">
            {chains.map((c, ci) => (
              <ChainCard key={ci} inv={inv} chain={c} chainIdx={ci}
                         currentUser={currentUser} now={now} onAct={onAct}
                         canFinance={canFinance} />
            ))}
            {!inv.fileUrl && (
              <p className="rounded-lg border border-dashed border-slate-300 px-3 py-2 text-xs text-slate-400">
                No file attached to this invoice.
              </p>
            )}
          </div>

          {inv.fileUrl && (
            <div className="lg:sticky lg:top-4 lg:self-start">
              <div className="overflow-hidden rounded-lg border border-slate-200 bg-white">
                {/\.(png|jpe?g|gif|webp)(\?|$)/i.test(inv.fileUrl) ? (
                  <div className="pdf-frame overflow-y-auto bg-slate-100">
                    <img src={inv.fileUrl} alt={inv.fileName || "invoice"} className="w-full" />
                  </div>
                ) : (
                  <iframe src={inv.fileUrl} title={inv.fileName || "invoice preview"}
                          className="pdf-frame bg-slate-100" />
                )}
                <div className="flex items-center justify-between border-t bg-slate-50 px-3 py-1.5">
                  <span className="truncate text-xs text-slate-500">{inv.fileName || "Attached file"}</span>
                  <a href={inv.fileUrl} target="_blank" rel="noopener noreferrer"
                     className="shrink-0 text-xs font-medium text-sky-700 hover:underline">
                    Open full size ↗
                  </a>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Finance processes payment once every chain has resolved. Pays the
          approved subset — "3 of 4" is a normal outcome, not an error. */}
      {canFinance && inv.status === "APPROVED" && resolved && approved > 0 && (
        <div className="mt-3 flex flex-wrap items-center gap-3 rounded-lg bg-emerald-50 p-3">
          <p className="text-sm text-emerald-800">
            {approved === chains.length
              ? "All " + chains.length + " store" + (chains.length > 1 ? "s" : "") + " approved."
              : approved + " of " + chains.length + " stores approved — pay the approved stores only."}
          </p>
          <button onClick={() => onMarkPaid(inv)}
            className="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
            Mark paid
          </button>
        </div>
      )}

      {(open || mineAny) && (
        <CommentThread invoiceId={inv.id} inv={inv} currentUser={currentUser}
                       canPost={!currentUser._sim} />
      )}
    </div>
  );
}

function ReportPanel({ invoices, users }) {
  const [start, setStart] = useState("");
  const [end, setEnd]     = useState("");
  const [statuses, setStatuses] = useState([]);   // empty = all
  const [vendor, setVendor] = useState("");
  const [dmId, setDmId]   = useState("");
  const [doId, setDoId]   = useState("");
  const [msg, setMsg]     = useState("");

  const vendors = useMemo(() =>
    [...new Set(invoices.map(i => i.vendor).filter(Boolean))].sort((a, b) => a.localeCompare(b)),
    [invoices]);

  const roster = useMemo(() => {
    const dms = new Map(), dos = new Map();
    invoices.forEach(i => getChains(i).forEach(c => (c.steps || []).forEach(st => {
      (st.userIds || []).forEach(id => {
        const nm = (users[id] && users[id].name) || st.name || id;
        if (st.role === "AREA_COACH") dms.set(id, nm);
        if (st.role === "DIRECTOR")   dos.set(id, nm);
      });
    })));
    const sortByName = m => [...m.entries()].sort((a, b) => a[1].localeCompare(b[1]));
    return { dms: sortByName(dms), dos: sortByName(dos) };
  }, [invoices, users]);

  function toggleStatus(v) {
    setStatuses(x => x.includes(v) ? x.filter(y => y !== v) : [...x, v]);
  }

  function download() {
    setMsg("");
    if (!window.XLSX) { setMsg("The Excel library didn't load — check your connection and reload."); return; }
    if (!start || !end) { setMsg("Pick both a start and an end date."); return; }
    const startMs = new Date(start + "T00:00:00").getTime();
    const endMs   = new Date(end + "T23:59:59.999").getTime();
    if (endMs < startMs) { setMsg("End date is before the start date."); return; }

    const rows = buildReportRows(invoices, {
      startMs, endMs,
      statuses: new Set(statuses),
      vendor, dmId, doId
    });
    if (!rows.length) { setMsg("No invoices match those filters — nothing to export."); return; }

    const ws = window.XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = Object.keys(rows[0]).map(k => ({
      wch: Math.min(40, Math.max(k.length, ...rows.map(r => String(r[k] ?? "").length)) + 2)
    }));
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, "Invoices");
    window.XLSX.writeFile(wb, "ap-report_" + start + "_to_" + end + ".xlsx");
    setMsg("✓ Exported " + rows.length + " row" + (rows.length > 1 ? "s" : "") + ".");
  }

  const statusOpts = ["PENDING", "APPROVED", "REJECTED", "PAID"];

  return (
    <div className="rounded-xl border bg-white p-5 shadow-sm">
      <h2 className="text-sm font-semibold text-slate-900">Excel report</h2>
      <p className="mt-1 text-sm text-slate-500">
        One row per store approval chain. A row is included when any of its
        activity — created, decided, or paid — falls inside the date range.
      </p>

      <div className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <label className="text-sm">
          <span className="text-slate-600">Start date</span>
          <input type="date" value={start} onChange={e => setStart(e.target.value)}
            className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </label>
        <label className="text-sm">
          <span className="text-slate-600">End date</span>
          <input type="date" value={end} onChange={e => setEnd(e.target.value)}
            className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </label>

        <div className="text-sm sm:col-span-2 lg:col-span-1">
          <span className="text-slate-600">Status (none checked = all)</span>
          <div className="mt-1 flex flex-wrap gap-1.5">
            {statusOpts.map(v => (
              <button key={v} type="button" onClick={() => toggleStatus(v)}
                className={"rounded-full border px-2.5 py-1 text-xs font-medium " +
                  (statuses.includes(v)
                    ? "border-slate-900 bg-slate-900 text-white"
                    : "border-slate-300 bg-white text-slate-600 hover:bg-slate-50")}>
                {v.charAt(0) + v.slice(1).toLowerCase()}
              </button>
            ))}
          </div>
        </div>

        <label className="text-sm">
          <span className="text-slate-600">Vendor</span>
          <select value={vendor} onChange={e => setVendor(e.target.value)}
            className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            <option value="">All vendors</option>
            {vendors.map(v => <option key={v} value={v}>{v}</option>)}
          </select>
        </label>

        <label className="text-sm">
          <span className="text-slate-600">District Manager</span>
          <select value={dmId} onChange={e => setDmId(e.target.value)}
            className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            <option value="">All DMs</option>
            {roster.dms.map(([id, nm]) => <option key={id} value={id}>{nm}</option>)}
          </select>
        </label>

        <label className="text-sm">
          <span className="text-slate-600">Director of Ops</span>
          <select value={doId} onChange={e => setDoId(e.target.value)}
            className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
            <option value="">All DOs</option>
            {roster.dos.map(([id, nm]) => <option key={id} value={id}>{nm}</option>)}
          </select>
        </label>
      </div>

      <div className="mt-4 flex flex-wrap items-center gap-3">
        <button onClick={download}
          className="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">
          Download Excel report
        </button>
        {msg && <span className={"text-sm " + (msg.startsWith("✓") ? "text-emerald-700" : "text-red-700")}>{msg}</span>}
      </div>
    </div>
  );
}

function VendorRoutingPanel({ invoices, vendorRules, currentUser }) {
  const [draft, setDraft] = useState(null);   // local edits until Save
  const [newVendor, setNewVendor] = useState("");
  const [msg, setMsg] = useState("");
  const rules = draft || vendorRules || {};

  const vendors = useMemo(() => {
    const set = new Map();
    Object.keys(CFG.vendorRuleSeeds).forEach(v => set.set(v, v.toUpperCase() === "AWT" ? "AWT" : v));
    (invoices || []).forEach(i => {
      const v = (i.vendor || "").trim();
      if (v) set.set(v.toLowerCase(), v);
    });
    Object.keys(rules).forEach(k => { if (!set.has(k)) set.set(k, k); });
    return [...set.entries()].sort((a, b) => a[1].localeCompare(b[1]));
  }, [invoices, rules]);

  function effective(key) { return vendorRuleFor(key, { rules }); }
  function setRule(key, v) {
    setMsg("");
    setDraft({ ...rules, [key]: v });
  }
  function addVendor() {
    const k = newVendor.trim().toLowerCase();
    if (!k) return;
    setDraft({ ...rules, [k]: "RAHIM" });
    setNewVendor("");
  }
  async function save() {
    try {
      await vendorRulesService.save(rules, currentUser);
      setDraft(null);
      setMsg("✓ Saved — applies to invoices created from now on.");
    } catch (e) { setMsg("Couldn't save: " + (e.message || "error")); }
  }

  return (
    <div className="rounded-xl border bg-white p-5 shadow-sm">
      <h2 className="text-sm font-semibold text-slate-900">Vendor routing — second approver</h2>
      <p className="mt-1 text-sm text-slate-500">
        Who checks the rate after the DM confirms the work. Unlisted vendors
        default to Rahim; AWT and Rheagl Services Company default to IT.
        Changes affect newly created invoices only.
      </p>

      <div className="mt-4 max-h-80 space-y-1 overflow-y-auto pr-1">
        {vendors.map(([key, label]) => (
          <div key={key} className="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
            <span className="min-w-0 truncate text-sm text-slate-800">{label}</span>
            <div className="flex shrink-0 gap-1">
              {[["NONE", "None"], ["IT", "IT"], ["RAHIM", "Rahim"]].map(([v, lbl]) => (
                <button key={v} type="button" onClick={() => setRule(key, v)}
                  className={"rounded-full border px-2.5 py-0.5 text-xs font-medium " +
                    (effective(key) === v
                      ? "border-slate-900 bg-slate-900 text-white"
                      : "border-slate-300 bg-white text-slate-600 hover:bg-slate-100")}>
                  {lbl}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="mt-3 flex flex-wrap items-center gap-2">
        <input value={newVendor} onChange={e => setNewVendor(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addVendor(); } }}
          placeholder="Add a vendor…"
          className="w-56 rounded-lg border border-slate-300 px-3 py-1.5 text-sm" />
        <button type="button" onClick={addVendor}
          className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
          Add
        </button>
        <button type="button" onClick={save} disabled={!draft}
          className="rounded-lg bg-slate-900 px-4 py-1.5 text-sm font-medium text-white disabled:opacity-40">
          Save changes
        </button>
        {msg && <span className={"text-sm " + (msg.startsWith("✓") ? "text-emerald-700" : "text-red-700")}>{msg}</span>}
      </div>
    </div>
  );
}
