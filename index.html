          </div>
          <div className="flex justify-between rounded-lg bg-slate-50 px-3 py-2">
            <dt className="text-slate-500">VP</dt>
            <dd className="text-slate-700">{CFG.vp.name}</dd>
          </div>
        </dl>
      </div>
    </div>
  );
}

function App() {
  const [ready, setReady]       = useState(false);
  const [dir, setDir]           = useState({ users: {}, stores: [] });
  const [session, setSession]   = useState(null);
  const [realSession, setReal]  = useState(null);   // admin's true session while impersonating
  const [showViewAs, setShowVA] = useState(false);
  const [invoices, setInvoices] = useState([]);
  const [tab, setTab]           = useState("inbox");
  const [err, setErr]           = useState("");
  const [now, setNow]           = useState(Date.now());
  const [dbHealth, setDbHealth] = useState(null);   // Firestore self-test verdict
  const [approverScreen, setApproverScreen] = useState("hub");   // "hub" | storeId
  const [financeScreen, setFinanceScreen] = useState("dashboard"); // "dashboard" | "new" | "report"
  const [vendorRules, setVendorRules] = useState({});   // vendor -> "NONE"|"IT"|"RAHIM"
  const [filters, setFilters]   = useState({ status: "", division: "", store: "", approver: "", q: "" });

  // Directory load, then silently restore a saved session against the LIVE
  // directory so a person removed upstream loses access on next load.
  useEffect(() => {
    directoryService.load()
      .then(d => {
        setDir(d); setReady(true);
        try {
          const saved = JSON.parse(localStorage.getItem("ap_session") || "null");
          if (saved && saved.email && saved.pw) {
            const s = resolveSession(saved.email, saved.pw, d);
            if (!s.error) setSession(s);
            else localStorage.removeItem("ap_session");
          }
        } catch (e) { /* ignore malformed */ }
      })
      .catch(e => { setErr("Directory: " + e.message); setReady(true); });
  }, []);

  useEffect(() => {
    let unsub;
    function start() {
      unsub = invoiceService.subscribe(docs => {
        // The vendor-routing rules live as a config doc inside the same
        // collection; peel it off before anything treats it as an invoice.
        const cfgDoc = docs.find(d => d.id === VENDOR_RULES_DOC || d._config);
        if (cfgDoc) setVendorRules(cfgDoc.rules || {});
        setInvoices(docs.filter(d => d.id !== VENDOR_RULES_DOC && !d._config));
      }, e => setErr("Firestore: " + e.message));
    }
    if (window.FS) start();
    else window.addEventListener("firebase-ready", start, { once: true });
    return () => unsub && unsub();
  }, []);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 60000);
    return () => clearInterval(t);
  }, []);

  // One startup probe: a missing database or blocked rules otherwise present
  // as saves that hang forever with no console error.
  useEffect(() => { probeFirestore().then(setDbHealth); }, []);

  function signIn(sess, creds) {
    setSession(sess);
    try { localStorage.setItem("ap_session", JSON.stringify(creds)); } catch (e) {}
  }

  function signOut() {
    setSession(null); setReal(null);
    try { localStorage.removeItem("ap_session"); } catch (e) {}
  }

  function startViewAs(row) {
    const sim = buildImpersonatedSession(row, dir);
    if (!sim) { setErr("Couldn't load that view."); return; }
    if (!realSession) setReal(session);   // remember the real admin session once
    setSession(sim);
    setShowVA(false);
    setTab("inbox");
  }

  function returnToMyAccount() {
    if (!realSession) return;
    setSession(realSession);
    setReal(null);
    setTab("inbox");
  }

  // --- Derived values -------------------------------------------------------
  // These must be computed BEFORE any early return. React requires the same
  // number of hooks on every render, so a useMemo placed after the loading/login
  // returns would run only once a session exists and crash with error #310.
  const isAdmin   = !!session && session.role === "ADMIN";
  const isApprover = !!session && (session.role === "AREA_COACH" || session.role === "DIRECTOR");

  // Approver hub: their stores as tiles with pending-on-them counts — the same
  // pattern as the repair app. Tiles are the union of their ASSIGNED stores
  // (even when all clear) and any store whose chain is waiting on them (covers
  // the VP stage on stores that aren't "theirs").
  const approverHub = useMemo(() => {
    if (!isApprover) return null;
    const counts = {};                     // storeId -> pending-on-me count
    const cmts = {};                       // storeId -> unread comments
    let cmtTotal = 0;
    invoices.forEach(i => {
      const unread = unreadCommentsFor(session.id, i);
      const seen = new Set();
      getChains(i).forEach(c => {
        if (canActOnChain(session, c)) counts[c.storeId] = (counts[c.storeId] || 0) + 1;
        // Attribute an invoice's unread comments to each of its stores once.
        if (unread > 0 && !seen.has(c.storeId)) {
          seen.add(c.storeId);
          cmts[c.storeId] = (cmts[c.storeId] || 0) + unread;
        }
      });
      cmtTotal += unread;
    });
    Object.keys(cmts).forEach(id => { counts[id] = counts[id] || 0; }); // ensure tile exists
    const assigned = dir.stores.filter(st =>
      (st.acIds || []).includes(session.id) || st.directorId === session.id);
    const byId = {};
    assigned.forEach(st => { byId[st.id] = { id: st.id, name: st.name,
      storeNumber: st.storeNumber, entity: st.entity, division: st.division,
      count: counts[st.id] || 0, comments: cmts[st.id] || 0 }; });
    Object.keys(counts).forEach(id => {
      if (byId[id]) return;
      const st = dir.stores.find(x => x.id === id);
      byId[id] = { id, name: st ? st.name : "(store)", storeNumber: st ? st.storeNumber : "",
        entity: st ? st.entity : "", division: st ? st.division : "",
        count: counts[id], comments: cmts[id] || 0 };
    });
    const tiles = Object.values(byId).sort((a, b) => a.name.localeCompare(b.name));
    return { tiles, total: Object.values(counts).reduce((n, x) => n + x, 0),
             commentTotal: cmtTotal };
  }, [isApprover, invoices, dir.stores, session]);
  const isFinance = !!session && session.role === "FINANCE";
  const canSeeAll = isAdmin || isFinance;

  // Finance and admin see everything; everyone else sees only what touches them.
  const visible = useMemo(() => {
    if (!session) return [];
    if (canSeeAll) return invoices;
    return invoices.filter(i =>
      getChains(i).some(c => (c.steps || []).some(s => (s.userIds || []).includes(session.id))) ||
      i.createdBy === session.id ||
      (session.storeId && (i.storeId === session.storeId ||
        (i.storeIds || []).includes(session.storeId))));
  }, [invoices, session, canSeeAll]);

  // Filters apply to the finance/admin dashboard only.
  const filtered = useMemo(() => {
    if (!canSeeAll) return visible;
    const q = (filters.q || "").trim().toLowerCase();
    return visible.filter(i => {
      if (filters.status && i.status !== filters.status) return false;
      if (filters.division && i.division !== filters.division) return false;
      if (filters.store && i.storeId !== filters.store &&
          !(i.storeIds || []).includes(filters.store)) return false;
      if (filters.approver && !getChains(i).some(c => (c.steps || [])
            .some(s => (s.userIds || []).includes(filters.approver)))) return false;
      if (q && !((i.vendor || "").toLowerCase().includes(q) ||
                 (i.invoiceNumber || "").toLowerCase().includes(q) ||
                 (i.storeName || "").toLowerCase().includes(q))) return false;
      return true;
    });
  }, [visible, filters, canSeeAll]);

  // --- Early returns (no hooks may appear below this line) ------------------
  if (!ready)   return <p className="p-8 text-slate-500">Loading directory…</p>;
  if (!session) return <Login dir={dir} onSignIn={signIn} />;

  const mine    = visible.filter(i => canUserAct(session, i));
  const pending = visible.filter(i => i.status === "PENDING");
  const done    = visible.filter(i => i.status !== "PENDING");

  const shown = canSeeAll
    ? (tab === "inbox" ? filtered.filter(i => canUserAct(session, i)) : filtered)
    : (tab === "inbox" ? mine : tab === "pending" ? pending : done);

  // Only Finance/AP and admin raise invoices.
  const canCreate = canSeeAll;

  return (
    <div className="w-full p-4 sm:p-6">
      <div className="mx-auto max-w-6xl">
      {session._sim && <SimBanner session={session} onReturn={returnToMyAccount} />}

      <header className="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-lg font-semibold text-slate-900">AP Invoice Routing</h1>
          <p className="text-sm text-slate-500">
            {session.name} · {roleLabel(session.role)}
          </p>
        </div>
        <div className="flex gap-2">
          {(isAdmin || (realSession && realSession.role === "ADMIN")) && !session._sim && (
            <button onClick={() => setShowVA(true)}
              className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
              View as…
            </button>
          )}
          <button onClick={signOut}
            className="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-slate-50">
            Sign out
          </button>
        </div>
      </header>

      {showViewAs && (
        <ViewAsModal dir={dir} onPick={startViewAs} onClose={() => setShowVA(false)} />
      )}

      {dbHealth && !dbHealth.ok && (
        <div className="mb-4 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-800">
          <p className="font-semibold">Database problem — saves will not work</p>
          <p className="mt-1">{dbHealth.message}</p>
        </div>
      )}

      {err && (
        <div className="mb-4 rounded-lg border border-amber-300 bg-amber-50 px-4 py-2 text-sm text-amber-800">
          {err}
        </div>
      )}

      <LateBanner invoices={pending} now={now} />

      {/* Finance toolbar: big upload entry top-left, Excel report top-right.
          The form and the report are their own screens now — the dashboard
          stays a dashboard. */}
      {canSeeAll && !session._sim && financeScreen === "dashboard" && (
        <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
          <button onClick={() => setFinanceScreen("new")}
            className="flex items-center gap-2 rounded-xl bg-slate-900 px-5 py-3 text-base font-semibold text-white shadow-sm hover:bg-slate-800">
            <span className="text-xl leading-none">＋</span> Upload New Invoice
          </button>
          <button onClick={() => setFinanceScreen("report")}
            className="flex items-center gap-2 rounded-xl border border-emerald-300 bg-white px-4 py-2.5 text-sm font-medium text-emerald-800 shadow-sm hover:bg-emerald-50">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="3" fill="#107c41"/>
              <path d="M7.6 6.5h2.9l1.7 3.1 1.8-3.1h2.8l-3.1 5 3.3 6h-2.9l-2-3.6-2 3.6H7.2l3.4-6z" fill="#fff"/>
            </svg>
            Excel report
          </button>
        </div>
      )}

      {canSeeAll && financeScreen === "report" && (
        <div>
          <button onClick={() => setFinanceScreen("dashboard")}
            className="mb-3 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-50">
            ← Back to dashboard
          </button>
          <ReportPanel invoices={invoices} users={dir.users} />
        </div>
      )}

      {canSeeAll && financeScreen === "dashboard" && (
        <FinanceDashboard invoices={visible} stores={dir.stores} users={dir.users}
                          filters={filters} setFilters={setFilters}
                          onStatusNav={() => setTab("all")} />
      )}

      </div>

      {/* Full-bleed upload screen: the approval path uses the left rail, the
          document preview the right rail. */}
      {canCreate && !session._sim && financeScreen === "new" && (
        <div className="mb-4">
          <div className="mx-auto mb-3 max-w-6xl">
            <button onClick={() => setFinanceScreen("dashboard")}
              className="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-50">
              ← Back to dashboard
            </button>
          </div>
          <NewInvoice stores={dir.stores} users={dir.users} currentUser={session}
                      vendorRules={vendorRules}
                      knownVendors={[...new Set(invoices.map(i => i.vendor).filter(Boolean))]} />
        </div>
      )}

      <div className="mx-auto max-w-6xl">

      {/* Approvers (DM / DO / VP) get a store-tile hub like the repair app;
          Finance/admin keep the tabbed dashboard. */}
      {(!canSeeAll || financeScreen === "dashboard") && (isApprover ? (
        approverScreen === "hub" ? (
          <div>
            <div className="mb-3 flex items-baseline justify-between">
              <h2 className="text-sm font-semibold uppercase tracking-wide text-slate-500">
                Your stores
              </h2>
              <span className="text-right text-sm text-slate-500">
                <span className="block">
                  {approverHub.total === 0 ? "Nothing waiting on you"
                    : "You have " + approverHub.total + " invoice" + (approverHub.total > 1 ? "s" : "") + " to review"}
                </span>
                {approverHub.commentTotal > 0 && (
                  <span className="block font-medium text-sky-700">
                    You have {approverHub.commentTotal} comment{approverHub.commentTotal > 1 ? "s" : ""} to view
                  </span>
                )}
              </span>
            </div>
            {approverHub.tiles.length === 0 ? (
              <p className="rounded-xl border border-dashed bg-white p-8 text-center text-sm text-slate-500">
                No stores are assigned to you in the directory.
              </p>
            ) : (
              <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4">
                {approverHub.tiles.map(t => (
                  <button key={t.id} onClick={() => setApproverScreen(t.id)}
                    className={"rounded-xl border p-4 text-left shadow-sm transition hover:shadow " +
                      (t.count > 0 ? "border-amber-300 bg-amber-50"
                       : t.comments > 0 ? "border-sky-300 bg-sky-50"
                       : "border-slate-200 bg-white")}>
                    <p className="truncate text-sm font-semibold text-slate-900">{t.name}</p>
                    <p className="truncate text-xs text-slate-500">
                      {[t.storeNumber, t.entity].filter(Boolean).join(" · ") || "—"}
                    </p>
                    <p className={"mt-3 text-2xl font-bold " +
                        (t.count > 0 ? "text-amber-700" : "text-slate-300")}>
                      {t.count}
                    </p>
                    <p className="text-xs text-slate-500">
                      {t.count === 0 ? "All clear" : "invoice" + (t.count > 1 ? "s" : "") + " to review"}
                    </p>
                    {t.comments > 0 && (
                      <p className="mt-1 text-xs font-medium text-sky-700">💬 {t.comments} comment{t.comments > 1 ? "s" : ""}</p>
                    )}
                  </button>
                ))}
              </div>
            )}
          </div>
        ) : (
          (() => {
            const st = approverHub.tiles.find(t => t.id === approverScreen) ||
                       { id: approverScreen, name: "(store)", count: 0 };
            const storeInvs = visible.filter(i =>
              getChains(i).some(c => c.storeId === approverScreen));
            const needsMe = storeInvs.filter(i =>
              getChains(i).some(c => c.storeId === approverScreen && canActOnChain(session, c)));
            const others = storeInvs.filter(i => !needsMe.includes(i));
            return (
              <div>
                <button onClick={() => setApproverScreen("hub")}
                  className="mb-3 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-50">
                  ← All stores
                </button>
                <h2 className="mb-3 text-base font-semibold text-slate-900">{st.name}</h2>

                <p className="mb-2 text-xs font-medium uppercase tracking-wide text-slate-500">
                  Needs you · {needsMe.length}
                </p>
                <div className="space-y-3">
                  {needsMe.length === 0 && (
                    <p className="rounded-xl border border-dashed bg-white p-6 text-center text-sm text-slate-500">
                      Nothing waiting on you at this store.
                    </p>
                  )}
                  {needsMe.map(inv => (
                    <InvoiceRow key={inv.id} inv={inv} users={dir.users} currentUser={session}
                                now={now} onAct={act} onMarkPaid={markPaid} onDelete={deleteInvoice}
                                canFinance={false} compact={needsMe.length > 1} />
                  ))}
                </div>

                {others.length > 0 && (
                  <>
                    <p className="mb-2 mt-6 text-xs font-medium uppercase tracking-wide text-slate-500">
                      Other invoices at this store · {others.length}
                    </p>
                    <div className="space-y-3">
                      {others.map(inv => (
                        <InvoiceRow key={inv.id} inv={inv} users={dir.users} currentUser={session}
                                    now={now} onAct={act} onMarkPaid={markPaid} onDelete={deleteInvoice}
                                    canFinance={false} compact={true} />
                      ))}
                    </div>
                  </>
                )}
              </div>
            );
          })()
        )
      ) : (
      <div>
      <nav className="mb-3 flex gap-1 rounded-lg bg-slate-200 p-1 text-sm">
        {(canSeeAll
          ? [["inbox", "Needs me (" + mine.length + ")"],
             ["all",   "All invoices (" + filtered.length + ")"],
             ["settings", "Settings"]]
          : [["inbox",   "Needs me (" + mine.length + ")"],
             ["pending", "All pending (" + pending.length + ")"],
             ["done",    "Closed (" + done.length + ")"]]
        ).map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)}
            className={"flex-1 rounded-md px-3 py-1.5 font-medium " +
              (tab === k ? "bg-white text-slate-900 shadow-sm" : "text-slate-600")}>
            {label}
          </button>
        ))}
      </nav>

      {tab === "settings" && canSeeAll ? (
        <SettingsPanel invoices={invoices} users={dir.users}
                       vendorRules={vendorRules} currentUser={session} />
      ) : (
      <div className="space-y-3">
        {shown.length === 0 && (
          <p className="rounded-xl border border-dashed bg-white p-8 text-center text-sm text-slate-500">
            {tab === "inbox" ? "Nothing waiting on you." : "No invoices match these filters."}
          </p>
        )}
        {shown.map(inv => (
          <InvoiceRow key={inv.id} inv={inv} users={dir.users} currentUser={session}
                      now={now} onAct={act} onMarkPaid={markPaid} onDelete={deleteInvoice}
                      canFinance={canSeeAll && !session._sim} />
        ))}
      </div>
      )}
      </div>
      ))}
      </div>
    </div>
  );

  async function act(inv, chainIdx, action, note) {
    // An impersonated session must never write — it is a view, not a login.
    if (session._sim) { setErr("You're viewing as someone else. Return to your account to act."); return; }

    const chains = getChains(inv).map(c => ({ ...c, history: [...(c.history || [])] }));
    const chain = chains[chainIdx];
    if (!chain) return;
    if (chain._legacy) { setErr("This invoice predates per-store chains. Ask IT to migrate or re-file it."); return; }

    const ts = Date.now();
    chain.history.push({ stage: chain.currentStage, by: session.id, byName: session.name,
                         action, note: note || "", ts });

    if (action === "REJECT") {
      chain.status = "REJECTED"; chain.stageEnteredAt = null;
    } else if (action === "APPROVE") {
      const idx = chain.steps.findIndex(s => s.role === chain.currentStage);
      const next = chain.steps[idx + 1];
      if (next) {
        chain.currentStage = next.role;
        chain.stageEnteredAt = ts;         // clock resets for the next approver
      } else {
        chain.status = "APPROVED";
        chain.currentStage = "APPROVED";
        chain.stageEnteredAt = null;
      }
    }

    await invoiceService.update(inv.id, {
      chains,
      status: deriveStatus(chains),
      updatedAt: ts
    });

    // One conversation per invoice: an approval/rejection note is a message
    // like any other, tagged with the action and store. This is also what
    // makes notes trigger the same notifications as comments.
    if ((note || "").trim()) {
      try {
        await commentService.add(inv.id, session, note.trim(), inv,
          { action, storeName: chain.storeName });
      } catch (e) { /* the decision is already saved; a failed echo is non-fatal */ }
    }
  }

  async function deleteInvoice(inv) {
    if (session._sim) { setErr("You're viewing as someone else. Return to your account to act."); return; }
    const ok = window.confirm(
      "Delete this invoice from " + (inv.vendor || "unknown vendor") +
      " for $" + Number(inv.amount || 0).toLocaleString() +
      "?\n\nThis removes it for everyone and cannot be undone.");
    if (!ok) return;
    try {
      await invoiceService.remove(inv.id);
    } catch (e) {
      setErr("Couldn't delete: " + (e.message || "unknown error"));
    }
  }

  async function markPaid(inv) {
    if (session._sim) { setErr("You're viewing as someone else. Return to your account to act."); return; }
    const ts = Date.now();
    await invoiceService.update(inv.id, {
      status: "PAID", paidAt: ts, updatedAt: ts,
      paidBy: session.id, paidByName: session.name
    });
  }
}

function Shell() {
  return (
    <div className="flex min-h-screen flex-col">
      <div className="flex-1"><App /></div>
      <footer className="border-t bg-white px-4 py-3 text-center text-xs text-slate-400">
        AP Invoice Routing · v{CFG.version} · Dossani Paradise
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell />);
</script>
</body>
</html>
